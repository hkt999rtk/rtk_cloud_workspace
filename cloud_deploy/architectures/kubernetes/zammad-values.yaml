# Zammad chart 17.0.2 (app 7.1.2-0013). Install only in the support namespace.
# Passwords come from the RTK per-environment SecretStore, never this file.
# Image versions are supplied from architecture.env by the shared renderer.
image:
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8080
ingress:
  enabled: false
zammadConfig:
  storageVolume:
    enabled: false # attachments live in Zammad PostgreSQL
# LKE Block Storage provisions at least 10Gi per PVC; request that explicitly.
elasticsearch:
  master:
    persistence:
      size: 10Gi
    # Preserve the chart's complete medium preset using canonical quantities.
    # Nonempty resources replace the entire preset for main and init containers.
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
        ephemeral-storage: 50Mi
      limits:
        cpu: 750m
        memory: 1536Mi
        ephemeral-storage: 2Gi
secrets:
  postgresql:
    useExisting: true
    secretName: zammad-postgres-password
    secretKey: postgres-password
  redis:
    useExisting: true
    secretName: zammad-redis-password
    secretKey: redis-password
postgres:
  persistence:
    size: 10Gi
  auth:
    username: zammad
    database: zammad_production
    existingSecret: zammad-postgres-password
    secretKeys:
      adminPasswordKey: postgres-password
redis:
  persistence:
    enabled: false # Zammad does not keep permanent data in Redis
  useDeployment: true
  auth:
    existingSecret: zammad-redis-password
    existingSecretPasswordKey: redis-password
