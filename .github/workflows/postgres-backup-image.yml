name: PostgreSQL Backup Runner

on:
  pull_request:
    paths:
      - scripts/go/**
      - cloud_deploy/architectures/kubernetes/postgres-backup/**
      - .github/workflows/postgres-backup-image.yml
  push:
    branches: [main]
    paths:
      - scripts/go/**
      - cloud_deploy/architectures/kubernetes/postgres-backup/**
      - .github/workflows/postgres-backup-image.yml
  workflow_dispatch:
    inputs:
      postgres_image:
        description: Existing source PostgreSQL 16 Alpine image (prefer its deployed digest)
        default: postgres:16-alpine
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: postgres-backup-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  runner:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: true
          submodules: false
      - name: Initialize workspace submodules
        env:
          CI_RUNNER_GITHUB_WORK_KEY: ${{ secrets.CI_RUNNER_GITHUB_WORK_KEY }}
        run: scripts/ci/init-submodules.sh
      - uses: actions/setup-go@v6
        with:
          go-version-file: scripts/go/go.mod
          cache: false
      - name: Test backup and deployment safety
        working-directory: scripts/go
        env:
          GOWORK: 'off'
          RTK_POSTGRES_BACKUP_INTEGRATION: '1'
          RTK_POSTGRES_BACKUP_LARGE_INTEGRATION: '1'
        run: |
          docker pull postgres:16-alpine
          go test -timeout=20m -count=1 ./rtk-cloud/internal/postgresbackup ./rtk-cloud/internal/recovery ./internal/cloudmonitor ./rtk-cloud
      - uses: docker/setup-buildx-action@v3
      - name: Resolve immutable source image
        id: images
        shell: bash
        env:
          REQUESTED_POSTGRES_IMAGE: ${{ inputs.postgres_image || 'postgres:16-alpine' }}
        run: |
          set -euo pipefail
          image="$REQUESTED_POSTGRES_IMAGE"
          [[ "$image" =~ ^[a-zA-Z0-9./:_@-]+$ ]]
          digest="$(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' | jq -er '.digest')"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          base="${image%@*}@$digest"
          repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "postgres=$base" >> "$GITHUB_OUTPUT"
          echo "runner=ghcr.io/$repository/postgres-backup:sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: cloud_deploy/architectures/kubernetes/postgres-backup/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.images.outputs.runner }}
          build-args: POSTGRES_IMAGE=${{ steps.images.outputs.postgres }}
      - name: Write source and runner image evidence
        env:
          SOURCE_IMAGE: ${{ steps.images.outputs.postgres }}
          RUNNER_TAG: ${{ steps.images.outputs.runner }}
          RUNNER_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/postgres-backup
          jq -n --arg source "$SOURCE_IMAGE" --arg tag "$RUNNER_TAG" --arg digest "$RUNNER_DIGEST" --arg commit "$GITHUB_SHA" '{version:1,source_postgres_image:$source,runner_tag:$tag,runner_digest:$digest,source_commit:$commit}' > .artifacts/postgres-backup/images.json
      - uses: actions/upload-artifact@v4
        with:
          name: postgres-backup-runner-images
          path: .artifacts/postgres-backup/images.json
