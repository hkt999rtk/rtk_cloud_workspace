name: OpenAPI Contract Validation

on:
  pull_request:
    paths:
      - '.github/workflows/contracts-openapi.yml'
      - 'scripts/validate_openapi.py'
      - 'scripts/test_validate_openapi.py'
      - 'scripts/openapi-requirements.txt'
      - 'scripts/ci/init-submodules.sh'
      - 'repos/**'
      - 'tests/spec-sources.yaml'
      - 'tests/catalog.yaml'
      - 'docs/spec-test-traceability.md'
      - 'scripts/go/rtk-cloud/test_spec_inventory*.go'
  push:
    branches: [main]
    paths:
      - '.github/workflows/contracts-openapi.yml'
      - 'scripts/validate_openapi.py'
      - 'scripts/test_validate_openapi.py'
      - 'scripts/openapi-requirements.txt'
      - 'scripts/ci/init-submodules.sh'
      - 'repos/**'
      - 'tests/spec-sources.yaml'
      - 'tests/catalog.yaml'
      - 'docs/spec-test-traceability.md'
      - 'scripts/go/rtk-cloud/test_spec_inventory*.go'

permissions:
  contents: read

jobs:
  validate:
    name: OpenAPI schemas and local references
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
      - name: Initialize exact workspace dependencies
        env:
          CI_RUNNER_GITHUB_WORK_KEY: ${{ secrets.CI_RUNNER_GITHUB_WORK_KEY }}
        run: scripts/ci/init-submodules.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/openapi-requirements.txt
      - run: python -m pip install -r scripts/openapi-requirements.txt
      - name: Validator regression tests
        run: python -m unittest discover -s scripts -p test_validate_openapi.py
      - name: Validate canonical, Account Manager, Billing and Cloud Admin contracts
        run: python scripts/validate_openapi.py
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.3'
          cache: false
      - name: Require complete normative specification mappings
        run: go run ./scripts/go/rtk-cloud -- test-spec-inventory check --mode required
