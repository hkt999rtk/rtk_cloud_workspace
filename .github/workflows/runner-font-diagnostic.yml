name: Runner font diagnostic

on:
  push:
    branches: [codex/self-hosted-linux-x64-runner]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fontconfig:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Inspect Traditional Chinese font resolution
        shell: bash
        run: |
          set -euo pipefail
          fc-match 'Noto Sans CJK TC:lang=zh-tw'
          fc-match ':lang=zh-tw'
          fc-list ':lang=zh-tw' family file | head -n 20
