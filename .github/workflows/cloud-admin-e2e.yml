name: Cloud Admin E2E

on:
  pull_request:
    paths:
      - 'scripts/go/rtk-cloud/test_catalog*.go'
      - 'scripts/go/rtk-cloud/test_ui*.go'
      - 'repos/rtk_cloud_admin/**'
      - 'repos/rtk_cloud_contracts_doc'
      - '.github/workflows/cloud-admin-e2e.yml'
  push:
    branches: [main]
  schedule:
    - cron: '17 18 * * *'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright ${{ matrix.ui }} E2E
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'ci-0' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ui: [desktop, mobile]
    steps:
      - name: Check out workspace
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - name: Initialize Cloud Admin and canonical contracts submodules
        env:
          CI_RUNNER_GITHUB_WORK_KEY: ${{ secrets.CI_RUNNER_GITHUB_WORK_KEY }}
        run: |
          set -euo pipefail
          test -n "$CI_RUNNER_GITHUB_WORK_KEY"
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$CI_RUNNER_GITHUB_WORK_KEY" > ~/.ssh/id_ed25519_github_work
          chmod 0600 ~/.ssh/id_ed25519_github_work
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git config --global core.sshCommand "ssh -i ~/.ssh/id_ed25519_github_work -o IdentitiesOnly=yes"
          git config --global --add url."git@github.com:".insteadOf "git@github-work.com:"
          git submodule sync
          git submodule foreach --recursive 'git reset --hard'
          git submodule update --init --depth=1 \
            repos/rtk_cloud_admin \
            repos/rtk_cloud_contracts_doc

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.3'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: repos/rtk_cloud_admin/web/package-lock.json

      - name: Install Cloud Admin browser dependencies
        working-directory: repos/rtk_cloud_admin/web
        run: |
          npm ci
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            sudo sed -i 's#http://azure.archive.ubuntu.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' /etc/apt/apt-mirrors.txt
          fi
          npx playwright install --with-deps chromium

      - name: Run headless UI-to-BFF E2E
        working-directory: scripts/go
        env:
          E2E_TEST_RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
        run: go run ./rtk-cloud -- test-ui --${{ matrix.ui }} --full --run-id "$E2E_TEST_RUN_ID"

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-admin-ui-${{ matrix.ui }}-gh-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/test-runs/gh-${{ github.run_id }}-${{ github.run_attempt }}/ui/${{ matrix.ui }}
            repos/rtk_cloud_admin/.artifacts/e2e-fixtures
          if-no-files-found: warn
          retention-days: ${{ github.event_name == 'pull_request' && 30 || 90 }}
