name: Cloud Admin E2E

on:
  pull_request:
    paths:
      - 'tests/catalog.yaml'
      - 'docs/testing.md'
      - 'docs/test-catalog.md'
      - 'scripts/go/rtk-cloud/**'
      - 'loadtests/home-100k/**'
      - 'repos/rtk_cloud_admin/**'
      - '.github/workflows/cloud-admin-e2e.yml'
  push:
    branches: [main]
  schedule:
    - cron: '17 18 * * *'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright ${{ matrix.ui }} E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        ui: [desktop, mobile]
    steps:
      - name: Check out workspace
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - name: Initialize Cloud Admin submodule
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "git@github-work.com:"
          git submodule update --init --depth=1 repos/rtk_cloud_admin

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.3'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: repos/rtk_cloud_admin/web/package-lock.json

      - name: Install Cloud Admin browser dependencies
        working-directory: repos/rtk_cloud_admin/web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run headless UI-to-BFF E2E
        working-directory: scripts/go
        env:
          E2E_TEST_RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
        run: go run ./rtk-cloud -- test-ui --${{ matrix.ui }} --full --run-id "$E2E_TEST_RUN_ID"

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-admin-ui-${{ matrix.ui }}-gh-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/test-runs/gh-${{ github.run_id }}-${{ github.run_attempt }}/ui/${{ matrix.ui }}
            repos/rtk_cloud_admin/.artifacts/e2e-fixtures
          if-no-files-found: warn
          retention-days: ${{ github.event_name == 'pull_request' && 30 || 90 }}
