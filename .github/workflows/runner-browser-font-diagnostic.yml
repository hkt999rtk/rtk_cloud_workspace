name: Runner Linux UI snapshot candidate

on:
  push:
    branches: [codex/self-hosted-linux-x64-runner]

permissions:
  contents: read

jobs:
  snapshots:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
      - name: Initialize Cloud Admin submodule
        shell: bash
        env:
          CI_RUNNER_GITHUB_WORK_KEY: ${{ secrets.CI_RUNNER_GITHUB_WORK_KEY }}
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$CI_RUNNER_GITHUB_WORK_KEY" > ~/.ssh/id_ed25519_github_work
          chmod 0600 ~/.ssh/id_ed25519_github_work
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git config --global core.sshCommand "ssh -i ~/.ssh/id_ed25519_github_work -o IdentitiesOnly=yes"
          git config --global --add url."git@github.com:".insteadOf "git@github-work.com:"
          git submodule update --init --depth=1 repos/rtk_cloud_admin
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.3"
      - name: Generate Linux snapshot candidates
        working-directory: repos/rtk_cloud_admin/web
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install chromium
          npm run e2e:generate-fixture
          node scripts/e2e-server.mjs > "$RUNNER_TEMP/cloud-admin-e2e-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18082/healthz >/dev/null; then
              break
            fi
            sleep 1
          done
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage();
          page.on('response', response => {
            if (response.url().includes('noto-sans')) console.log(`FONT_RESPONSE ${response.status()} ${response.url()}`);
          });
          await page.request.post('http://127.0.0.1:18082/api/auth/platform/login', {
            data: { email: 'platform.admin@example.com', password: 'e2e-platform-password' },
          });
          await page.goto('http://127.0.0.1:18082/admin/chipset-providers', { waitUntil: 'networkidle' });
          await page.evaluate(() => document.fonts.ready);
          console.log('FONT_FACES', await page.evaluate(() => [...document.fonts].map(font => ({ family: font.family, status: font.status }))));
          const cdp = await page.context().newCDPSession(page);
          await cdp.send('DOM.enable');
          await cdp.send('CSS.enable');
          const { root } = await cdp.send('DOM.getDocument');
          const { nodeId } = await cdp.send('DOM.querySelector', { nodeId: root.nodeId, selector: 'h1' });
          console.log('PLATFORM_FONTS', JSON.stringify(await cdp.send('CSS.getPlatformFontsForNode', { nodeId }), null, 2));
          await browser.close();
          NODE
          kill "$server_pid" 2>/dev/null || true
          wait "$server_pid" 2>/dev/null || true
          trap - EXIT
          npx playwright test e2e/chipset-sdk.visual.spec.mjs \
            --project=chromium --project=mobile --workers=1 --update-snapshots
      - name: Upload Linux snapshot candidates
        uses: actions/upload-artifact@v6
        with:
          name: cloud-admin-linux-snapshot-candidates-${{ github.run_id }}
          path: repos/rtk_cloud_admin/web/e2e/chipset-sdk.visual.spec.mjs-snapshots/*-linux.png
          if-no-files-found: error
