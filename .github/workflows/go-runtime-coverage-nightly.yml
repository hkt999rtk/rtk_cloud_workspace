name: Go Runtime Coverage Nightly

on:
  schedule:
    - cron: "30 17 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Validate prerequisites or execute the isolated runtime suite
        type: choice
        options: [preflight, run]
        default: preflight
        required: true
      confirm:
        description: Run mode requires video-cloud-staging-lke
        type: string
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: staging-mutating-tests
  cancel-in-progress: false

jobs:
  runtime-coverage:
    name: Isolated deployed Go coverage
    if: github.event_name == 'workflow_dispatch' || vars.RUNTIME_COVERAGE_NIGHTLY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      RUNTIME_COVERAGE_MODE: ${{ github.event_name == 'schedule' && 'run' || inputs.mode }}
      RUNTIME_COVERAGE_CONFIRM: ${{ github.event_name == 'schedule' && 'video-cloud-staging-lke' || inputs.confirm }}
      RUNTIME_COVERAGE_RUN_ID: runtime-${{ github.run_id }}-${{ github.run_attempt }}
      RUNTIME_COVERAGE_STACK: coverage-${{ github.run_id }}-${{ github.run_attempt }}
      RUNTIME_COVERAGE_REGISTRY: ghcr.io/hkt999rtk/rtk_cloud_workspace/runtime-coverage
      RUNTIME_SOURCE_STACK_ENV: ${{ github.workspace }}/cloud_env/staging/linode/env/stack.env
      RUNTIME_COVERAGE_OUTPUT_ROOT: ${{ github.workspace }}/.artifacts/runtime-coverage/runtime-${{ github.run_id }}-${{ github.run_attempt }}
      RUNTIME_COVERAGE_PREFLIGHT_REPORT: ${{ github.workspace }}/.artifacts/runtime-coverage/runtime-${{ github.run_id }}-${{ github.run_attempt }}/preflight-report.json
      RUNTIME_COVERAGE_SHARED_CLUSTER: "1"
      RUNTIME_COVERAGE_FEATURE_WORKFLOW: workflow-local-live
      RUNTIME_COVERAGE_RUNNER_LABEL: ubuntu-24.04
      RUNTIME_COVERAGE_RUNNER_OS: Linux
      RUNTIME_COVERAGE_RUNNER_ARCH: X64
      CLOUD_STAGING_LKE_CLUSTER_LABEL: video-cloud-staging-lke
      LKE_CLUSTER_LABEL: video-cloud-staging-lke
      LKE_ACTIVE_SERVICE_LIMIT: ${{ vars.LKE_ACTIVE_SERVICE_LIMIT }}
      LKE_POSTGRES_STORAGE_MODE: emptydir
      RUNTIME_COVERAGE_PLANNED_PVCS: "5"
      RUNTIME_COVERAGE_PLANNED_LOAD_BALANCERS: "0"
      RUNTIME_COVERAGE_PLANNED_GENERATORS: "0"
      LINODE_TOKEN: ${{ secrets.LINODE_TOKEN }}
      GHCR_PULL_USERNAME: ${{ github.actor }}
      GHCR_PULL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: true
          submodules: false

      - name: Initialize private submodules
        env:
          CI_RUNNER_GITHUB_WORK_KEY: ${{ secrets.CI_RUNNER_GITHUB_WORK_KEY }}
        run: scripts/ci/init-submodules.sh

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: |
            scripts/go/go.sum
            e2e_test/go.sum
            loadtests/home-100k/go.sum

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - uses: docker/setup-buildx-action@v3

      - name: Acquire shared staging kubeconfig without mutating the cluster
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          clusters="$RUNNER_TEMP/runtime-coverage-clusters.json"
          response="$RUNNER_TEMP/runtime-coverage-kubeconfig.json"
          kubeconfig="$RUNNER_TEMP/runtime-coverage-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.kubeconfig"
          runtime_env_root="$RUNNER_TEMP/rtk-runtime-coverage/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/lke"
          curl -fsS \
            -H "Authorization: Bearer $LINODE_TOKEN" \
            "https://api.linode.com/v4/lke/clusters?page_size=100" > "$clusters"
          cluster_id="$(jq -er --arg label "$CLOUD_STAGING_LKE_CLUSTER_LABEL" '.data[] | select(.label == $label) | .id' "$clusters")"
          curl -fsS \
            -H "Authorization: Bearer $LINODE_TOKEN" \
            "https://api.linode.com/v4/lke/clusters/$cluster_id/kubeconfig" > "$response"
          jq -er '.kubeconfig' "$response" | openssl base64 -d -A > "$kubeconfig"
          chmod 0600 "$kubeconfig"
          {
            echo "CLOUD_STAGING_LKE_CLUSTER_ID=$cluster_id"
            echo "LKE_CLUSTER_ID=$cluster_id"
            echo "KUBECONFIG=$kubeconfig"
            echo "RTK_CLOUD_LKE_KUBECONFIG=$kubeconfig"
            echo "RUNTIME_ENV_ROOT=$runtime_env_root"
          } >> "$GITHUB_ENV"
          staging_video_namespace="$(
            kubectl --kubeconfig "$kubeconfig" get deployment -A -o json |
              jq -er '
                [.items[]
                  | select(.metadata.name == "video-cloud-api")
                  | select(.metadata.labels["rtk.realtek.com/stack"] == "video-cloud-staging")
                  | .metadata.namespace
                ] | if length == 1 then .[0] else error("expected one shared staging video-cloud-api deployment") end
              '
          )"
          staging_deployment="$RUNNER_TEMP/runtime-coverage-staging-video-deployment.json"
          staging_secret="$RUNNER_TEMP/runtime-coverage-staging-video-secret.json"
          kubectl --kubeconfig "$kubeconfig" -n "$staging_video_namespace" \
            get deployment video-cloud-api -o json > "$staging_deployment"
          kubectl --kubeconfig "$kubeconfig" -n "$staging_video_namespace" \
            get secret video-cloud-runtime -o json > "$staging_secret"
          deployment_env() {
            jq -er --arg name "$1" '
              [.spec.template.spec.containers[].env[]?
                | select(.name == $name)
                | .value
              ] | if length > 0 and .[0] != null and .[0] != "" then .[0] else error("missing deployment environment value") end
            ' "$staging_deployment"
          }
          blob_access_key="$(jq -er '.data.AWS_ACCESS_KEY_ID | @base64d | select(length > 0)' "$staging_secret")"
          blob_secret_key="$(jq -er '.data.AWS_SECRET_ACCESS_KEY | @base64d | select(length > 0)' "$staging_secret")"
          turn_shared_secret="$(jq -er '.data.VIDEO_CLOUD_TURN_SHARED_SECRET | @base64d | select(length > 0)' "$staging_secret")"
          blob_endpoint="$(deployment_env VIDEO_CLOUD_BLOB_ENDPOINT)"
          blob_region="$(deployment_env VIDEO_CLOUD_BLOB_REGION)"
          blob_bucket="$(deployment_env VIDEO_CLOUD_BLOB_BUCKET)"
          turn_urls="$(deployment_env VIDEO_CLOUD_WEBRTC_TURN_URLS)"
          turn_public_host="$(
            printf '%s\n' "$turn_urls" |
              tr ',' '\n' |
              sed -E 's#^[a-z]+:##; s#[?].*$##; s#:[0-9]+$##' |
              head -n 1
          )"
          test -n "$turn_public_host"
          echo "::add-mask::$blob_access_key"
          echo "::add-mask::$blob_secret_key"
          echo "::add-mask::$turn_shared_secret"
          {
            echo "RUNTIME_COVERAGE_STORAGE_SOURCE_NAMESPACE=$staging_video_namespace"
            echo "RUNTIME_COVERAGE_SHARED_TURN_HOST=$turn_public_host"
            echo "LINODE_OBJ_ACCESS_KEY_ID=$blob_access_key"
            echo "LINODE_OBJ_SECRET_ACCESS_KEY=$blob_secret_key"
            echo "LINODE_OBJ_ENDPOINT=$blob_endpoint"
            echo "LINODE_OBJ_REGION=$blob_region"
            echo "LINODE_OBJ_BUCKET=$blob_bucket"
            echo "LKE_TURN_SHARED=$turn_shared_secret"
            echo "VIDEO_CLOUD_WEBRTC_TURN_URLS=$turn_urls"
          } >> "$GITHUB_ENV"

      - name: Snapshot shared staging deployment anchors
        continue-on-error: true
        run: scripts/ci/runtime-coverage-k8s.sh snapshot

      - name: Validate runtime prerequisites
        id: preflight
        run: scripts/ci/runtime-coverage-preflight.sh

      - name: Publish preflight report
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNTIME_COVERAGE_PREFLIGHT_REPORT" ]]; then
            {
              echo "## Runtime coverage preflight"
              echo
              echo '```json'
              cat "$RUNTIME_COVERAGE_PREFLIGHT_REPORT"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Stop after read-only preflight
        if: env.RUNTIME_COVERAGE_MODE == 'preflight'
        run: echo "Preflight completed without creating runtime resources."

      - name: Log in to GHCR
        if: env.RUNTIME_COVERAGE_MODE == 'run'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare run-scoped environment from tracked configuration
        if: env.RUNTIME_COVERAGE_MODE == 'run'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUNTIME_COVERAGE_CONFIRM" == "$CLOUD_STAGING_LKE_CLUSTER_LABEL" ]]
          [[ "$RUNTIME_COVERAGE_STACK" == coverage-* ]]
          [[ "$RUNTIME_COVERAGE_STACK" != *staging* ]]
          [[ "$RUNTIME_COVERAGE_STACK" != *prod* ]]
          test -f "$RUNTIME_SOURCE_STACK_ENV"
          test "$RUNTIME_COVERAGE_STORAGE_SOURCE_NAMESPACE" = "video-cloud-staging-video-cloud"
          mkdir -p "$RUNTIME_ENV_ROOT/env" "$RUNTIME_ENV_ROOT/adapters/lke"
          cp "$RUNTIME_SOURCE_STACK_ENV" "$RUNTIME_ENV_ROOT/env/stack.env"
          perl -0pi -e "s/^CLOUD_STACK_NAME=.*/CLOUD_STACK_NAME=$RUNTIME_COVERAGE_STACK/m; s/^CLOUD_ENV_NAME=.*/CLOUD_ENV_NAME=runtime-coverage/m; s/^CLOUD_PROVIDER=.*/CLOUD_PROVIDER=lke/m" \
            "$RUNTIME_ENV_ROOT/env/stack.env"
          perl -0pi -e "s/^CLOUD_DNS_ROOT_DOMAIN=.*/CLOUD_DNS_ROOT_DOMAIN=$RUNTIME_COVERAGE_STACK.invalid/m; s/^VIDEO_CLOUD_DOMAIN=.*/VIDEO_CLOUD_DOMAIN=video.$RUNTIME_COVERAGE_STACK.invalid/m; s/^VIDEO_CLOUD_CERTISSUER_DOMAIN=.*/VIDEO_CLOUD_CERTISSUER_DOMAIN=certissuer.$RUNTIME_COVERAGE_STACK.invalid/m; s/^ACCOUNT_MANAGER_DOMAIN=.*/ACCOUNT_MANAGER_DOMAIN=account.$RUNTIME_COVERAGE_STACK.invalid/m; s/^CLOUD_ADMIN_DOMAIN=.*/CLOUD_ADMIN_DOMAIN=admin.$RUNTIME_COVERAGE_STACK.invalid/m; s/^CLOUD_LOGGER_DOMAIN=.*/CLOUD_LOGGER_DOMAIN=logger.$RUNTIME_COVERAGE_STACK.invalid/m" \
            "$RUNTIME_ENV_ROOT/env/stack.env"
          cloud_region="$(awk -F= '$1 == "CLOUD_REGION" {print substr($0, index($0, "=") + 1)}' "$RUNTIME_ENV_ROOT/env/stack.env")"
          test -n "$cloud_region"
          echo "CLOUD_REGION=$cloud_region" >> "$GITHUB_ENV"
          blob_endpoint="$LINODE_OBJ_ENDPOINT"
          [[ "$blob_endpoint" == http://* || "$blob_endpoint" == https://* ]] ||
            blob_endpoint="https://$blob_endpoint"
          test -n "$LINODE_OBJ_REGION"
          video_cloud_api_base_url="https://video.$RUNTIME_COVERAGE_STACK.invalid:18443"
          {
            printf '\nCLOUD_RUNTIME_COVERAGE_STACK=%s\n' "$RUNTIME_COVERAGE_STACK"
            printf 'VIDEO_CLOUD_API_BASE_URL=%s\n' "$video_cloud_api_base_url"
            printf 'VIDEO_CLOUD_BLOB_ENDPOINT=%s\n' "$blob_endpoint"
            printf 'VIDEO_CLOUD_BLOB_REGION=%s\n' "$LINODE_OBJ_REGION"
            printf 'VIDEO_CLOUD_BLOB_BUCKET=%s\n' "$LINODE_OBJ_BUCKET"
            printf 'VIDEO_CLOUD_BLOB_PREFIX=runtime-coverage/%s\n' "$RUNTIME_COVERAGE_RUN_ID"
            printf 'VIDEO_CLOUD_BLOB_FORCE_PATH_STYLE=false\n'
            printf 'VIDEO_CLOUD_CLIP_DIRECT_UPLOAD_ENABLED=true\n'
            printf 'VIDEO_CLOUD_WEBRTC_TURN_URLS=%s\n' "$VIDEO_CLOUD_WEBRTC_TURN_URLS"
          } >> "$RUNTIME_ENV_ROOT/env/stack.env"
          printf 'LKE_ACTIVE_SERVICE_LIMIT=%s\n' "$LKE_ACTIVE_SERVICE_LIMIT" > "$RUNTIME_ENV_ROOT/adapters/lke/account.env"
          printf 'LKE_CLUSTER_ID=%s\nLKE_CLUSTER_LABEL=%s\n' "$LKE_CLUSTER_ID" "$LKE_CLUSTER_LABEL" > "$RUNTIME_ENV_ROOT/adapters/lke/state.env"
          go run ./scripts/go/rtk-cloud -- sync-env \
            --workspace "$GITHUB_WORKSPACE" \
            --env-root "$RUNTIME_ENV_ROOT"
          grep -qx "CLOUD_STACK_NAME=$RUNTIME_COVERAGE_STACK" "$RUNTIME_ENV_ROOT/env/stack.env"
          grep -qx "CLOUD_PROVIDER=lke" "$RUNTIME_ENV_ROOT/env/stack.env"
          grep -Fxq "VIDEO_CLOUD_API_BASE_URL=$video_cloud_api_base_url" "$RUNTIME_ENV_ROOT/env/stack.env"

      - name: Build and push coverage-only images
        if: env.RUNTIME_COVERAGE_MODE == 'run'
        shell: bash
        run: |
          set -euo pipefail
          metadata_dir="$RUNNER_TEMP/runtime-coverage-image-metadata"
          mkdir -p "$metadata_dir"
          account_image="$RUNTIME_COVERAGE_REGISTRY/account-manager:$RUNTIME_COVERAGE_RUN_ID"
          admin_image="$RUNTIME_COVERAGE_REGISTRY/cloud-admin:$RUNTIME_COVERAGE_RUN_ID"
          frontend_image="$RUNTIME_COVERAGE_REGISTRY/cloud-frontend:$RUNTIME_COVERAGE_RUN_ID"
          logger_image="$RUNTIME_COVERAGE_REGISTRY/cloud-logger:$RUNTIME_COVERAGE_RUN_ID"
          video_image="$RUNTIME_COVERAGE_REGISTRY/video-cloud:$RUNTIME_COVERAGE_RUN_ID"
          build_coverage_image() {
            local env_key="$1"
            local metadata_name="$2"
            local image="$3"
            local dockerfile="$4"
            local context="$5"
            local metadata="$metadata_dir/$metadata_name.json"
            local digest pinned_image
            docker buildx build \
              --platform linux/amd64 \
              --push \
              --provenance=false \
              --build-context runtime_coverage_helper=tests/runtime-coverage \
              --metadata-file "$metadata" \
              -f "$dockerfile" \
              -t "$image" \
              "$context"
            digest="$(jq -er '."containerimage.digest"' "$metadata")"
            [[ "$digest" == sha256:* ]]
            pinned_image="$image@$digest"
            export "$env_key=$pinned_image"
            export "${env_key}_DIGEST=$digest"
            {
              echo "$env_key=$pinned_image"
              echo "${env_key}_DIGEST=$digest"
            } >> "$GITHUB_ENV"
          }
          build_coverage_image LKE_ACCOUNT_MANAGER_IMAGE account-manager "$account_image" tests/runtime-coverage/Dockerfile.account-manager repos/rtk_account_manager
          build_coverage_image LKE_CLOUD_ADMIN_IMAGE cloud-admin "$admin_image" tests/runtime-coverage/Dockerfile.cloud-admin repos/rtk_cloud_admin
          build_coverage_image LKE_FRONTEND_IMAGE cloud-frontend "$frontend_image" tests/runtime-coverage/Dockerfile.cloud-frontend repos/rtk_cloud_frontend
          build_coverage_image LKE_CLOUD_LOGGER_IMAGE cloud-logger "$logger_image" tests/runtime-coverage/Dockerfile.cloud-logger repos/rtk_cloud_logger
          build_coverage_image LKE_VIDEO_CLOUD_IMAGE video-cloud "$video_image" tests/runtime-coverage/Dockerfile.video-cloud repos/rtk_video_cloud
          manifest="$RUNTIME_ENV_ROOT/artifacts/lke-images/lke-image-manifest.json"
          mkdir -p "$(dirname "$manifest")"
          go run ./scripts/go/rtk-cloud -- lke-resolve-images \
            --workspace "$GITHUB_WORKSPACE" \
            --env-root "$RUNTIME_ENV_ROOT" \
            --skip-verify \
            --out "$manifest"
          jq -e '
            [.images[]
              | select(.source_path != null)
              | select((.digest | startswith("sha256:")) and (.source_commit | length == 40))
            ] | length == 5
          ' "$manifest" >/dev/null

      - name: Deploy isolated stack without public DNS, edge VMs, or cluster changes
        if: env.RUNTIME_COVERAGE_MODE == 'run'
        shell: bash
        run: |
          set -euo pipefail
          go run ./scripts/go/rtk-cloud -- provision \
            --workspace "$GITHUB_WORKSPACE" \
            --env-root "$RUNTIME_ENV_ROOT" \
            --preflight --plan --apply --deploy --artifacts \
            --confirm "$RUNTIME_COVERAGE_STACK"
          echo "RUNTIME_COVERAGE_DEPLOYED=1" >> "$GITHUB_ENV"

      - name: Verify isolated deployment image digests and commits
        if: env.RUNTIME_COVERAGE_MODE == 'run'
        run: scripts/ci/runtime-coverage-k8s.sh verify

      - name: Create run-scoped feature endpoints without DNS
        if: env.RUNTIME_COVERAGE_MODE == 'run'
        shell: bash
        run: |
          set -euo pipefail
          scripts/ci/runtime-coverage-k8s.sh endpoints
          endpoint_env="$RUNTIME_COVERAGE_OUTPUT_ROOT/feature-endpoints.env"
          test -s "$endpoint_env"
          cat "$endpoint_env" >> "$GITHUB_ENV"
          ingress_ip="$(awk -F= '$1 == "RUNTIME_COVERAGE_INGRESS_IP" {print $2}' "$endpoint_env")"
          hostnames="$(awk -F= '$1 == "RUNTIME_COVERAGE_HOSTNAMES" {print $2}' "$endpoint_env" | tr ',' ' ')"
          server_ca="$(awk -F= '$1 == "RUNTIME_COVERAGE_SERVER_CA" {print substr($0, index($0, "=") + 1)}' "$endpoint_env")"
          test -n "$ingress_ip"
          test -n "$hostnames"
          test -s "$server_ca"
          printf '%s %s # runtime-coverage-%s\n' "$ingress_ip" "$hostnames" "$RUNTIME_COVERAGE_RUN_ID" |
            sudo tee -a /etc/hosts >/dev/null
          sudo cp "$server_ca" \
            "/usr/local/share/ca-certificates/$RUNTIME_COVERAGE_RUN_ID.crt"
          sudo update-ca-certificates

      - name: Attach run-scoped coverage PVCs
        if: env.RUNTIME_COVERAGE_MODE == 'run'
        shell: bash
        run: |
          set -euo pipefail
          scripts/ci/runtime-coverage-k8s.sh prepare
          echo "RUNTIME_COVERAGE_PREPARED=1" >> "$GITHUB_ENV"

      - name: Prepare run-scoped Clip credentials
        if: env.RUNTIME_COVERAGE_MODE == 'run'
        shell: bash
        run: |
          set -euo pipefail
          namespace="$RUNTIME_COVERAGE_STACK-video-cloud"
          user_private="$RUNNER_TEMP/runtime-coverage-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-clip-user-private.pem"
          server_private="$RUNNER_TEMP/runtime-coverage-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-clip-server-private.pem"
          server_public="$RUNNER_TEMP/runtime-coverage-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-clip-server-public.pem"
          openssl ecparam -name prime256v1 -genkey -noout -out "$user_private"
          kubectl --kubeconfig "$KUBECONFIG" -n "$namespace" \
            get secret video-cloud-runtime -o jsonpath='{.data.clip-private-key\.pem}' |
            openssl base64 -d -A > "$server_private"
          chmod 0600 "$user_private" "$server_private"
          openssl ec -in "$server_private" -pubout -out "$server_public" 2>/dev/null
          chmod 0600 "$server_public"
          rm -f "$server_private"
          admin_token="$(
            kubectl --kubeconfig "$KUBECONFIG" -n "$namespace" \
              exec deployment/video-cloud-api -- /app/admin-token --ttl 1h
          )"
          test -n "$admin_token"
          echo "::add-mask::$admin_token"
          {
            echo "VIDEO_CLOUD_LOAD_ADMIN_TOKEN=$admin_token"
            echo "VIDEO_CLOUD_LOAD_CLIP_USER_PRIVATE_KEY=$user_private"
            echo "VIDEO_CLOUD_LOAD_CLIP_SERVER_PUBLIC_KEY=$server_public"
          } >> "$GITHUB_ENV"

      - name: Run onboarding and cross-service lifecycle checks
        if: env.RUNTIME_COVERAGE_MODE == 'run'
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME_COVERAGE_LOGGER_TUNNEL=false scripts/ci/runtime-coverage-k8s.sh tunnel-start
          trap 'scripts/ci/runtime-coverage-k8s.sh tunnel-stop' EXIT
          curl --fail --silent --show-error --max-time 10 "$ACCOUNT_MANAGER_BASE_URL/v1/health" >/dev/null
          curl --fail --silent --show-error --max-time 10 "$VIDEO_CLOUD_BASE_URL/version" >/dev/null
          export CLOUD_STAGING_E2E_VIDEO_CLOUD_TOKEN_BASE_URL_OVERRIDE="$VIDEO_CLOUD_TOKEN_BASE_URL"
          export CLOUD_STAGING_E2E_FACTORY_ENROLL_PORT=18444
          export CLOUD_STAGING_E2E_MQTT_PORT=18884
          go run ./scripts/go/rtk-cloud -- test-live \
            --env-root "$RUNTIME_ENV_ROOT" \
            --run --confirm "$RUNTIME_COVERAGE_STACK" \
            --skip-remove --skip-provision \
            --steps data,mqtt,runtime-logs,billing-log,billing-db \
            --user-count 2 --device-count 12 \
            --device-mix light=10,camera=2 \
            --out-dir ".artifacts/test-runs/$RUNTIME_COVERAGE_RUN_ID/live"

      - name: Run all feature canaries
        if: env.RUNTIME_COVERAGE_MODE == 'run'
        shell: bash
        run: |
          set -euo pipefail
          export HOME100K_ENV_ROOT="$RUNTIME_ENV_ROOT"
          scripts/ci/runtime-coverage-k8s.sh tunnel-start
          trap 'scripts/ci/runtime-coverage-k8s.sh tunnel-stop' EXIT
          for feature in device-shadow video-webrtc clip-storage; do
            go run ./scripts/go/rtk-cloud -- test-feature \
              --feature "$feature" \
              --profile canary \
              --environment staging \
              --env-root "$RUNTIME_ENV_ROOT" \
              --run-id "$RUNTIME_COVERAGE_RUN_ID" \
              --run --confirm "$RUNTIME_COVERAGE_STACK"
          done

      - name: Run desktop and mobile deployed UI smoke
        if: env.RUNTIME_COVERAGE_MODE == 'run'
        shell: bash
        env:
          E2E_EVIDENCE_SAFE: "1"
        run: |
          set -euo pipefail
          kubectl --kubeconfig "$KUBECONFIG" -n "$RUNTIME_COVERAGE_STACK-admin" \
            port-forward svc/cloud-admin 18082:80 > "$RUNNER_TEMP/runtime-coverage-admin-port-forward.log" 2>&1 &
          admin_port_forward_pid=$!
          kubectl --kubeconfig "$KUBECONFIG" -n "$RUNTIME_COVERAGE_STACK-account-manager" \
            port-forward svc/account-manager 18081:80 > "$RUNNER_TEMP/runtime-coverage-account-manager-port-forward.log" 2>&1 &
          account_manager_port_forward_pid=$!
          platform_payload="$RUNNER_TEMP/runtime-platform-login.json"
          customer_payload="$RUNNER_TEMP/runtime-customer-login.json"
          customer_register_payload="$RUNNER_TEMP/runtime-customer-register.json"
          customer_register_response="$RUNNER_TEMP/runtime-customer-register-response.json"
          platform_headers="$RUNNER_TEMP/runtime-platform-headers.txt"
          customer_headers="$RUNNER_TEMP/runtime-customer-headers.txt"
          trap 'kill "$admin_port_forward_pid" "$account_manager_port_forward_pid" 2>/dev/null || true; rm -f "$platform_payload" "$customer_payload" "$customer_register_payload" "$customer_register_response" "$platform_headers" "$customer_headers"' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:18082/healthz >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:18082/healthz >/dev/null
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:18081/v1/health >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:18081/v1/health >/dev/null
          platform_email="$(kubectl --kubeconfig "$KUBECONFIG" -n "$RUNTIME_COVERAGE_STACK-account-manager" \
            get secret account-manager-runtime -o jsonpath='{.data.ACCOUNT_MANAGER_BOOTSTRAP_PLATFORM_ADMIN_EMAIL}' | openssl base64 -d -A)"
          platform_password="$(kubectl --kubeconfig "$KUBECONFIG" -n "$RUNTIME_COVERAGE_STACK-account-manager" \
            get secret account-manager-runtime -o jsonpath='{.data.ACCOUNT_MANAGER_BOOTSTRAP_PLATFORM_ADMIN_PASSWORD}' | openssl base64 -d -A)"
          test_data_db="$RUNTIME_ENV_ROOT/artifacts/test-data/rtk-test-data.sqlite"
          test -s "$test_data_db"
          customer_email="$(sqlite3 "$test_data_db" "select email from users where role = 'member' order by email limit 1;")"
          customer_password="$(sqlite3 "$test_data_db" "select password from users where role = 'member' order by email limit 1;")"
          jq -n --arg email "$platform_email" --arg password "$platform_password" \
            '{email:$email,password:$password}' > "$platform_payload"
          jq -n --arg email "$customer_email" --arg password "$customer_password" \
            '{email:$email,password:$password}' > "$customer_payload"
          jq -n --arg email "$customer_email" --arg password "$customer_password" \
            '{email:$email,password:$password,organization_name:"Runtime Coverage Customer"}' > "$customer_register_payload"
          chmod 0600 "$platform_payload" "$customer_payload" "$customer_register_payload"
          curl -fsS -o "$customer_register_response" \
            -H 'content-type: application/json' \
            --data-binary "@$customer_register_payload" \
            http://127.0.0.1:18081/v1/auth/register
          E2E_BRAND_CLOUD_ID="$(jq -r '.organization.id // empty' "$customer_register_response")"
          test -n "$E2E_BRAND_CLOUD_ID"
          curl -fsS -D "$platform_headers" -o /dev/null \
            -H 'content-type: application/json' \
            --data-binary "@$platform_payload" \
            http://127.0.0.1:18082/api/auth/platform/login
          curl -fsS -D "$customer_headers" -o /dev/null \
            -H 'content-type: application/json' \
            --data-binary "@$customer_payload" \
            http://127.0.0.1:18082/api/auth/customer/login
          E2E_PLATFORM_SESSION_ID="$(sed -nE 's/^[Ss]et-[Cc]ookie: rtk_admin_session=([^;]+).*/\1/p' "$platform_headers" | head -1)"
          E2E_CUSTOMER_SESSION_ID="$(sed -nE 's/^[Ss]et-[Cc]ookie: rtk_admin_session=([^;]+).*/\1/p' "$customer_headers" | head -1)"
          test -n "$E2E_PLATFORM_SESSION_ID"
          test -n "$E2E_CUSTOMER_SESSION_ID"
          echo "::add-mask::$E2E_PLATFORM_SESSION_ID"
          echo "::add-mask::$E2E_CUSTOMER_SESSION_ID"
          export E2E_PLATFORM_SESSION_ID E2E_CUSTOMER_SESSION_ID E2E_BRAND_CLOUD_ID
          E2E_BASE_URL=http://127.0.0.1:18082 \
            go run ./scripts/go/rtk-cloud -- test-ui \
              --staging --desktop --mobile --install \
              --run-id "$RUNTIME_COVERAGE_RUN_ID"

      - name: Aggregate runtime feature evidence
        if: always() && env.RUNTIME_COVERAGE_MODE == 'run' && env.RUNTIME_COVERAGE_PREPARED == '1'
        shell: bash
        run: |
          set -euo pipefail
          go run ./scripts/go/rtk-cloud -- test-feature-coverage audit \
            --mode main \
            --evidence ".artifacts/test-runs/$RUNTIME_COVERAGE_RUN_ID" \
            --output-dir ".artifacts/test-runs/$RUNTIME_COVERAGE_RUN_ID/feature-coverage"

      - name: Gracefully stop services and collect runtime counters
        if: always() && env.RUNTIME_COVERAGE_MODE == 'run' && env.RUNTIME_COVERAGE_PREPARED == '1'
        run: scripts/ci/runtime-coverage-k8s.sh collect

      - name: Aggregate runtime coverage and verify anchors
        if: always() && env.RUNTIME_COVERAGE_MODE == 'run' && env.RUNTIME_COVERAGE_PREPARED == '1'
        shell: bash
        run: |
          set -euo pipefail
          go run ./scripts/go/rtk-cloud -- test-coverage \
            --profile runtime \
            --module account-manager,cloud-admin-backend,cloud-frontend,cloud-logger,video-cloud \
            --runtime-dir "$RUNTIME_COVERAGE_OUTPUT_ROOT" \
            --run-id "$RUNTIME_COVERAGE_RUN_ID"

      - name: Delete isolated resources and verify shared staging
        if: always() && env.RUNTIME_COVERAGE_MODE == 'run'
        run: scripts/ci/runtime-coverage-k8s.sh cleanup

      - name: Upload runtime reports and evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: go-runtime-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/runtime-coverage/${{ env.RUNTIME_COVERAGE_RUN_ID }}/**
            .artifacts/test-runs/${{ env.RUNTIME_COVERAGE_RUN_ID }}/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

      - name: Remove runner-local credentials and run state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sudo sed -i "/# runtime-coverage-$RUNTIME_COVERAGE_RUN_ID$/d" /etc/hosts
          sudo rm -f "/usr/local/share/ca-certificates/$RUNTIME_COVERAGE_RUN_ID.crt"
          sudo update-ca-certificates
          if [[ "${RUNTIME_ENV_ROOT:-}" == "$RUNNER_TEMP/rtk-runtime-coverage/"*"/lke" ]]; then
            rm -rf "$RUNTIME_ENV_ROOT"
          fi
          if [[ "${KUBECONFIG:-}" == "$RUNNER_TEMP/"* ]]; then
            rm -f "$KUBECONFIG"
          fi
          for credential_path in \
            "${VIDEO_CLOUD_LOAD_CLIP_USER_PRIVATE_KEY:-}" \
            "${VIDEO_CLOUD_LOAD_CLIP_SERVER_PUBLIC_KEY:-}"; do
            if [[ "$credential_path" == "$RUNNER_TEMP/runtime-coverage-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-clip-"*".pem" ]]; then
              rm -f "$credential_path"
            fi
          done
