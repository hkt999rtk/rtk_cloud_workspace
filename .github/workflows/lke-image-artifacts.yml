name: LKE Image Manifest

on:
  pull_request:
    paths:
      - ".github/workflows/lke-image-artifacts.yml"
      - "scripts/go/go.mod"
      - "scripts/go/go.sum"
      - "scripts/go/rtk-cloud/deployment_*lke*.go"
      - "scripts/go/rtk-cloud/lke*.go"
      - "scripts/go/rtk-cloud/main.go"
      - "scripts/go/rtk-cloud/payment_simulator_lke_test.go"
      - "scripts/go/rtk-cloud/provider_lke.go"
      - "docs/lke-migration-inventory.md"
      - "scripts/README.md"
  workflow_dispatch:
    inputs:
      owner:
        description: "GHCR owner/organization. Defaults to hkt999rtk."
        required: false
        type: string
      registry_host:
        description: "Container registry host. Defaults to ghcr.io."
        required: false
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate LKE image manifest tooling
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - name: Check out workspace metadata
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache: false
          cache-dependency-path: scripts/go/go.sum

      - name: Run LKE image manifest tests
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          cd scripts/go
          GOWORK=off go test ./rtk-cloud -run 'TestRunLKEBuildImagesWritesManifest|TestRunLKEResolveImages|TestRunProvisionLKEDeployDoesNotBuildServiceImagesWhenRegistryConfigured|TestLKEPostgresStatefulSetUsesPostgresImageOverride'

  resolve:
    name: Resolve LKE image manifest
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60
    environment: staging
    env:
      CLOUD_STAGING_LKE_CLUSTER_LABEL: video-cloud-staging-lke
      LINODE_TOKEN: ${{ secrets.LINODE_TOKEN }}
    steps:
      - name: Check out workspace metadata
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - name: Initialize private submodules
        shell: bash
        env:
          CI_RUNNER_GITHUB_WORK_KEY: ${{ secrets.CI_RUNNER_GITHUB_WORK_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$CI_RUNNER_GITHUB_WORK_KEY" ]; then
            echo "CI_RUNNER_GITHUB_WORK_KEY is required to fetch private git@github-work.com: submodules." >&2
            exit 1
          fi
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$CI_RUNNER_GITHUB_WORK_KEY" > ~/.ssh/id_ed25519_github_work
          chmod 0600 ~/.ssh/id_ed25519_github_work
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git config --local core.sshCommand "ssh -i ~/.ssh/id_ed25519_github_work -o IdentitiesOnly=yes"
          git config --local --add url."git@github.com:".insteadOf "git@github-work.com:"
          git config --local --add url."git@github.com:".insteadOf "https://github.com/"
          git submodule sync --recursive
          git submodule foreach --recursive 'git reset --hard'
          git submodule update --init --recursive --depth=1

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache: false
          cache-dependency-path: scripts/go/go.sum

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in with the existing staging GHCR pull identity
        shell: bash
        run: |
          set -euo pipefail
          clusters="$RUNNER_TEMP/lke-image-clusters.json"
          response="$RUNNER_TEMP/lke-image-kubeconfig.json"
          kubeconfig="$RUNNER_TEMP/lke-image-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.kubeconfig"
          registry_config="$RUNNER_TEMP/lke-image-ghcr-pull.json"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $LINODE_TOKEN" \
            "https://api.linode.com/v4/lke/clusters?page_size=100" > "$clusters"
          cluster_id="$(jq -er --arg label "$CLOUD_STAGING_LKE_CLUSTER_LABEL" '.data[] | select(.label == $label) | .id' "$clusters")"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $LINODE_TOKEN" \
            "https://api.linode.com/v4/lke/clusters/$cluster_id/kubeconfig" > "$response"
          jq -er '.kubeconfig' "$response" | openssl base64 -d -A > "$kubeconfig"
          chmod 0600 "$kubeconfig"
          kubectl --kubeconfig "$kubeconfig" -n video-cloud-staging-account-manager \
            get secret ghcr-pull -o jsonpath='{.data.\.dockerconfigjson}' | \
            openssl base64 -d -A > "$registry_config"
          chmod 0600 "$registry_config"
          username="$(jq -r '.auths["ghcr.io"].username // empty' "$registry_config")"
          password="$(jq -r '.auths["ghcr.io"].password // empty' "$registry_config")"
          if [ -z "$username" ] || [ -z "$password" ]; then
            auth="$(jq -er '.auths["ghcr.io"].auth' "$registry_config")"
            decoded="$(printf '%s' "$auth" | openssl base64 -d -A)"
            username="${decoded%%:*}"
            password="${decoded#*:}"
            test "$password" != "$decoded"
          fi
          test -n "$username"
          test -n "$password"
          echo "::add-mask::$username"
          echo "::add-mask::$password"
          printf '%s' "$password" | docker login ghcr.io --username "$username" --password-stdin >/dev/null

      - name: Resolve and verify LKE images
        shell: bash
        env:
          INPUT_OWNER: ${{ inputs.owner }}
          INPUT_REGISTRY_HOST: ${{ inputs.registry_host }}
        run: |
          set -euo pipefail
          owner="${INPUT_OWNER:-hkt999rtk}"
          registry_host="${INPUT_REGISTRY_HOST:-ghcr.io}"
          mkdir -p .artifacts/lke-images
          go run ./scripts/go/rtk-cloud -- lke-resolve-images \
            --workspace "$GITHUB_WORKSPACE" \
            --env-root cloud_env/staging/runtime \
            --registry-host "$registry_host" \
            --owner "$owner" \
            --out .artifacts/lke-images/lke-image-manifest.json
          jq -r '.env | to_entries[] | "export \(.key)=\(.value|@sh)"' \
            .artifacts/lke-images/lke-image-manifest.json \
            > .artifacts/lke-images/lke-image-env.sh

      - name: Summarize images
        shell: bash
        run: |
          {
            echo "Resolved LKE image manifest."
            echo
            echo "| Env key | Image |"
            echo "| --- | --- |"
            jq -r '.env | to_entries[] | "| `\(.key)` | `\(.value)` |"' .artifacts/lke-images/lke-image-manifest.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload LKE image manifest
        uses: actions/upload-artifact@v4
        with:
          name: lke-image-artifacts
          path: .artifacts/lke-images/
          if-no-files-found: error

      - name: Remove temporary staging credentials
        if: always()
        shell: bash
        run: |
          rm -f \
            "$RUNNER_TEMP/lke-image-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.kubeconfig" \
            "$RUNNER_TEMP/lke-image-clusters.json" \
            "$RUNNER_TEMP/lke-image-kubeconfig.json" \
            "$RUNNER_TEMP/lke-image-ghcr-pull.json"
