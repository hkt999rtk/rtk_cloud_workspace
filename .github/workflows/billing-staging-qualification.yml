name: Billing Staging Qualification

on:
  schedule:
    - cron: "15 18 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Validate the plan or execute the dedicated staging qualification
        type: choice
        options: [plan, run]
        default: plan
        required: true
      confirm:
        description: Run mode requires video-cloud-staging-lke
        type: string
        required: false
      initialize_billing_inbox:
        description: One-time explicit initialization of the retained Cloud Logger billing inbox
        type: boolean
        default: false
        required: false

permissions:
  contents: read
  packages: read

concurrency:
  group: staging-mutating-tests
  cancel-in-progress: false

jobs:
  qualify:
    name: Deployed Billing payment and portal qualification
    if: github.event_name == 'workflow_dispatch' || vars.BILLING_STAGING_QUALIFICATION_ENABLED == 'true'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    environment: staging
    env:
      BILLING_QUALIFICATION_MODE: ${{ github.event_name == 'schedule' && 'run' || inputs.mode }}
      BILLING_QUALIFICATION_CONFIRM: ${{ github.event_name == 'schedule' && 'video-cloud-staging-lke' || inputs.confirm }}
      BILLING_QUALIFICATION_INITIALIZE_INBOX: ${{ github.event_name == 'workflow_dispatch' && inputs.initialize_billing_inbox || false }}
      BILLING_QUALIFICATION_RUN_ID: billing-staging-${{ github.run_id }}-${{ github.run_attempt }}
      CLOUD_PROVIDER: lke
      CLOUD_STACK_NAME: video-cloud-staging
      CLOUD_STAGING_LKE_CLUSTER_LABEL: video-cloud-staging-lke
      LINODE_TOKEN: ${{ secrets.LINODE_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false

      - name: Initialize qualification runtime path
        shell: bash
        run: echo "BILLING_STAGING_ENV_ROOT=$RUNNER_TEMP/billing-staging-runtime" >> "$GITHUB_ENV"

      - name: Initialize private Billing and Cloud Admin sources
        env:
          CI_RUNNER_GITHUB_WORK_KEY: ${{ secrets.CI_RUNNER_GITHUB_WORK_KEY }}
        run: scripts/ci/init-submodules.sh

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache: false
          cache-dependency-path: scripts/go/go.sum

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: repos/rtk_cloud_admin/web/package-lock.json

      - uses: docker/setup-buildx-action@v3
        if: env.BILLING_QUALIFICATION_MODE == 'run'

      - name: Acquire staging kubeconfig and existing GHCR pull identity
        if: env.BILLING_QUALIFICATION_MODE == 'run'
        shell: bash
        run: |
          set -euo pipefail
          clusters="$RUNNER_TEMP/billing-clusters.json"
          response="$RUNNER_TEMP/billing-kubeconfig.json"
          kubeconfig="$RUNNER_TEMP/billing-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.kubeconfig"
          registry_config="$RUNNER_TEMP/billing-ghcr-pull.json"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $LINODE_TOKEN" \
            "https://api.linode.com/v4/lke/clusters?page_size=100" > "$clusters"
          cluster_id="$(jq -er --arg label "$CLOUD_STAGING_LKE_CLUSTER_LABEL" '.data[] | select(.label == $label) | .id' "$clusters")"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $LINODE_TOKEN" \
            "https://api.linode.com/v4/lke/clusters/$cluster_id/kubeconfig" > "$response"
          jq -er '.kubeconfig' "$response" | openssl base64 -d -A > "$kubeconfig"
          chmod 0600 "$kubeconfig"
          kubectl --kubeconfig "$kubeconfig" -n video-cloud-staging-account-manager \
            get secret ghcr-pull -o jsonpath='{.data.\.dockerconfigjson}' | \
            openssl base64 -d -A > "$registry_config"
          chmod 0600 "$registry_config"
          username="$(jq -r '.auths["ghcr.io"].username // empty' "$registry_config")"
          password="$(jq -r '.auths["ghcr.io"].password // empty' "$registry_config")"
          if [ -z "$username" ] || [ -z "$password" ]; then
            auth="$(jq -er '.auths["ghcr.io"].auth' "$registry_config")"
            decoded="$(printf '%s' "$auth" | openssl base64 -d -A)"
            username="${decoded%%:*}"
            password="${decoded#*:}"
            test "$password" != "$decoded"
          fi
          test -n "$username"
          test -n "$password"
          echo "::add-mask::$username"
          echo "::add-mask::$password"
          printf '%s' "$password" | docker login ghcr.io --username "$username" --password-stdin >/dev/null
          {
            printf 'KUBECONFIG=%s\n' "$kubeconfig"
            printf 'GHCR_PULL_USERNAME=%s\n' "$username"
            printf 'GHCR_PULL_TOKEN=%s\n' "$password"
          } >> "$GITHUB_ENV"

      - name: Resolve official Billing, Account Manager, and Cloud Admin images
        if: env.BILLING_QUALIFICATION_MODE == 'run'
        shell: bash
        run: |
          set -euo pipefail
          cp cloud_env/staging/environment.env "$(dirname "$BILLING_STAGING_ENV_ROOT")/environment.env"
          mkdir -p "$BILLING_STAGING_ENV_ROOT/env"
          cp cloud_env/staging/linode/env/stack.env "$BILLING_STAGING_ENV_ROOT/env/stack.env"
          for key in \
            AUTH_TOKEN_BASE_URL SENDMAIL_HTTP_BASE_URL SENDMAIL_HTTP_TIMEOUT \
            EMAIL_OUTBOX_POLL_INTERVAL EMAIL_OUTBOX_BATCH_SIZE EMAIL_OUTBOX_MAX_ATTEMPTS \
            EMAIL_OUTBOX_RETRY_BASE EMAIL_OUTBOX_RETRY_MAX; do
            setting="$(awk -v key="$key" 'index($0, key "=") == 1 { print; exit }' cloud_env/staging/environment.env)"
            test -n "$setting"
            printf '%s\n' "$setting" >> "$BILLING_STAGING_ENV_ROOT/env/stack.env"
          done
          awk -F= '/^[A-Z0-9_]+=/ { print }' \
            cloud_env/staging/overrides/architecture.env >> "$BILLING_STAGING_ENV_ROOT/env/stack.env"
          if [ "$BILLING_QUALIFICATION_INITIALIZE_INBOX" = "true" ]; then
            printf '%s\n' 'LKE_CLOUD_LOGGER_INITIALIZE_BILLING_INBOX=true' >> "$BILLING_STAGING_ENV_ROOT/env/stack.env"
          fi
          current_video_cloud="$RUNNER_TEMP/current-video-cloud-api.json"
          kubectl --request-timeout=15s -n video-cloud-staging-video-cloud \
            get deployment video-cloud-api -o json > "$current_video_cloud"
          tracked_bucket="$(awk -F= '$1 == "RUNTIME_MEDIA_STORAGE_BUCKET" { print $2; exit }' cloud_env/staging/storage.env)"
          tracked_prefix="$(awk -F= '$1 == "RUNTIME_MEDIA_STORAGE_PREFIX" { print $2; exit }' cloud_env/staging/storage.env)"
          for key in \
            VIDEO_CLOUD_BLOB_ENDPOINT VIDEO_CLOUD_BLOB_REGION VIDEO_CLOUD_BLOB_BUCKET \
            VIDEO_CLOUD_BLOB_PREFIX VIDEO_CLOUD_BLOB_FORCE_PATH_STYLE; do
            value="$(jq -er --arg key "$key" \
              '.spec.template.spec.containers[] | select(.name == "app") | .env[] | select(.name == $key) | .value' \
              "$current_video_cloud")"
            printf '%s=%s\n' "$key" "$value" >> "$BILLING_STAGING_ENV_ROOT/env/stack.env"
          done
          test "$(awk -F= '$1 == "VIDEO_CLOUD_BLOB_BUCKET" { value=$2 } END { print value }' "$BILLING_STAGING_ENV_ROOT/env/stack.env")" = "$tracked_bucket"
          test "$(awk -F= '$1 == "VIDEO_CLOUD_BLOB_PREFIX" { value=$2 } END { print value }' "$BILLING_STAGING_ENV_ROOT/env/stack.env")" = "$tracked_prefix"
          perl -0pi -e 's/^CLOUD_PROVIDER=.*/CLOUD_PROVIDER=lke/m' "$BILLING_STAGING_ENV_ROOT/env/stack.env"
          go run ./scripts/go/rtk-cloud -- sync-env \
            --workspace "$GITHUB_WORKSPACE" \
            --env-root "$BILLING_STAGING_ENV_ROOT"
          manifest="$BILLING_STAGING_ENV_ROOT/artifacts/lke-images/lke-image-manifest.json"
          mkdir -p "$(dirname "$manifest")"
          go run ./scripts/go/rtk-cloud -- lke-resolve-images \
            --workspace "$GITHUB_WORKSPACE" \
            --env-root "$BILLING_STAGING_ENV_ROOT" \
            --owner hkt999rtk \
            --out "$manifest"
          for key in LKE_BILLING_IMAGE LKE_ACCOUNT_MANAGER_IMAGE LKE_CLOUD_ADMIN_IMAGE; do
            value="$(jq -er --arg key "$key" '.env[$key]' "$manifest")"
            printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
          done

      - name: Validate qualification mode and catalog
        shell: bash
        run: |
          set -euo pipefail
          if [ "$BILLING_QUALIFICATION_MODE" = "run" ] && [ "$BILLING_QUALIFICATION_CONFIRM" != "video-cloud-staging-lke" ]; then
            echo "run mode requires the exact video-cloud-staging-lke confirmation" >&2
            exit 1
          fi
          go run ./scripts/go/rtk-cloud -- test-catalog check
          go run ./scripts/go/rtk-cloud -- test-payment \
            --profile staging-live \
            --run-id "$BILLING_QUALIFICATION_RUN_ID"

      - name: Install responsive browser runtime
        if: env.BILLING_QUALIFICATION_MODE == 'run'
        working-directory: repos/rtk_cloud_admin/web
        run: |
          npm ci
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            sudo sed -i 's#http://azure.archive.ubuntu.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' /etc/apt/apt-mirrors.txt
          fi
          npx playwright install --with-deps chromium

      - name: Deploy the coordinated multicloud stack without rotating shared PKI
        if: env.BILLING_QUALIFICATION_MODE == 'run'
        env:
          RTK_CLOUD_SECRET_BUNDLE: ${{ secrets.RTK_CLOUD_SECRET_BUNDLE }}
        shell: bash
        run: |
          set -euo pipefail
          export RTK_CLOUD_CONFIG_ROOT="$RUNNER_TEMP/rtk_cloud"
          echo "RTK_CLOUD_CONFIG_ROOT=$RTK_CLOUD_CONFIG_ROOT" >> "$GITHUB_ENV"
          test -n "$RTK_CLOUD_SECRET_BUNDLE"
          bundle="$RUNNER_TEMP/rtk-cloud-staging-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          printf '%s' "$RTK_CLOUD_SECRET_BUNDLE" > "$bundle"
          chmod 0600 "$bundle"
          scripts/ci/materialize-rtk-cloud-secret-store.sh staging "$bundle" "$KUBECONFIG"
          go run ./scripts/go/rtk-cloud -- provision \
            --workspace "$GITHUB_WORKSPACE" \
            --env-root "$BILLING_STAGING_ENV_ROOT" \
            --preflight \
            --apply \
            --deploy \
            --confirm video-cloud-staging
          go run ./scripts/go/rtk-cloud -- secrets verify \
            --environment staging \
            --config-root "$RTK_CLOUD_CONFIG_ROOT"

      - name: Verify deployed Billing rollout and public health
        if: env.BILLING_QUALIFICATION_MODE == 'run'
        shell: bash
        run: |
          set -euo pipefail
          namespace="video-cloud-staging-billing"
          kubectl --request-timeout=15s -n "$namespace" rollout status deployment/billing --timeout=180s
          kubectl --request-timeout=15s -n "$namespace" rollout status deployment/billing-payment-worker --timeout=180s
          kubectl --request-timeout=15s -n "$namespace" rollout status deployment/payment-simulator --timeout=180s
          kubectl --request-timeout=15s -n video-cloud-staging-account-manager \
            rollout status deployment/account-manager --timeout=180s
          kubectl --request-timeout=15s -n video-cloud-staging-account-manager \
            rollout status deployment/account-manager-handoff-worker --timeout=180s
          kubectl --request-timeout=15s -n video-cloud-staging-admin \
            rollout status deployment/cloud-admin --timeout=180s
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            --max-time 15 \
            https://billing.video-cloud-staging.realtekconnect.com/readyz >/dev/null

      - name: Execute dedicated Billing staging qualification
        if: env.BILLING_QUALIFICATION_MODE == 'run'
        shell: bash
        run: |
          set -euo pipefail
          go run ./scripts/go/rtk-cloud -- test-payment \
            --profile staging-live \
            --run-id "$BILLING_QUALIFICATION_RUN_ID" \
            --account-manager-base-url https://account-manager.video-cloud-staging.realtekconnect.com \
            --billing-base-url https://billing.video-cloud-staging.realtekconnect.com \
            --cloud-admin-base-url https://admin.video-cloud-staging.realtekconnect.com \
            --customer-session-file "$RUNNER_TEMP/billing-customer-session" \
            --bootstrap-test-org \
            --env-root "$BILLING_STAGING_ENV_ROOT" \
            --run \
            --confirm "$BILLING_QUALIFICATION_CONFIRM" \
            --confirm-test-org rtk-payment-simulator-qualification

      - name: Execute real Cloud Admin Billing smoke on desktop and mobile
        if: env.BILLING_QUALIFICATION_MODE == 'run'
        working-directory: repos/rtk_cloud_admin/web
        env:
          E2E_BASE_URL: https://admin.video-cloud-staging.realtekconnect.com
          E2E_BILLING_OTHER_ORG_ID: ${{ vars.BILLING_STAGING_OTHER_ORG_ID }}
          E2E_TEST_ENVIRONMENT: staging
          E2E_TEST_RUN_ID: ${{ env.BILLING_QUALIFICATION_RUN_ID }}
          E2E_TEST_RUN_DIR: ${{ github.workspace }}/.artifacts/test-runs/${{ env.BILLING_QUALIFICATION_RUN_ID }}/cloud-admin-billing
          E2E_EXPECTED_TEST_IDS: UI-CA-BILLING-STG-001,UI-CA-BILLING-STG-002,UI-CA-BILLING-STG-003
        shell: bash
        run: |
          set -euo pipefail
          E2E_CUSTOMER_SESSION_ID="$(<"$RUNNER_TEMP/billing-customer-session")"
          test -n "$E2E_CUSTOMER_SESSION_ID"
          echo "::add-mask::$E2E_CUSTOMER_SESSION_ID"
          export E2E_CUSTOMER_SESSION_ID
          context="$GITHUB_WORKSPACE/.artifacts/test-runs/$BILLING_QUALIFICATION_RUN_ID/payments/staging-live/qualification-context.json"
          export E2E_BILLING_ORG_ID="$(jq -er '.organization_id' "$context")"
          export E2E_BILLING_INVOICE_ID="$(jq -er '.invoice_id' "$context")"
          npm run e2e:billing:staging

      - name: Revoke ephemeral Cloud Admin customer session
        if: always() && env.BILLING_QUALIFICATION_MODE == 'run'
        shell: bash
        run: |
          set -euo pipefail
          session_file="$RUNNER_TEMP/billing-customer-session"
          if [ -s "$session_file" ]; then
            session="$(<"$session_file")"
            echo "::add-mask::$session"
            curl --fail --silent --show-error --max-time 15 \
              -X POST \
              -H "Cookie: rtk_admin_session=$session" \
              https://admin.video-cloud-staging.realtekconnect.com/api/auth/logout >/dev/null
            rm -f "$session_file"
          fi

      - name: Upload sanitized qualification evidence
        if: always() && env.BILLING_QUALIFICATION_MODE == 'run'
        uses: actions/upload-artifact@v6
        with:
          name: billing-staging-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/test-runs/${{ env.BILLING_QUALIFICATION_RUN_ID }}/**
          if-no-files-found: warn
          retention-days: 90

      - name: Remove job-only SecretStore
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          RTK_CLOUD_CONFIG_ROOT="$RUNNER_TEMP/rtk_cloud"
          case "$RTK_CLOUD_CONFIG_ROOT/" in "$RUNNER_TEMP/"*) rm -rf "$RTK_CLOUD_CONFIG_ROOT" ;; *) exit 1 ;; esac
          rm -f \
            "$RUNNER_TEMP/rtk-cloud-staging-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json" \
            "$RUNNER_TEMP/billing-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.kubeconfig" \
            "$RUNNER_TEMP/billing-clusters.json" \
            "$RUNNER_TEMP/billing-kubeconfig.json" \
            "$RUNNER_TEMP/billing-ghcr-pull.json"
