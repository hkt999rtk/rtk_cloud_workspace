name: Workspace Test Baseline

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: Workspace baseline, E2E, and affected services
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out workspace
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false

      - name: Initialize workspace submodules
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "git@github-work.com:"
          git config --global --add url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "git@github.com-work:"
          git config --global --add url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "git@github.com:"
          git submodule sync --recursive
          git submodule update --init --recursive --depth=1

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: |
            scripts/go/go.sum
            e2e_test/go.sum
            loadtests/home-100k/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Resolve comparison base
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_ref="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base_ref="${{ github.event.before }}"
          else
            base_ref=""
          fi
          echo "base_ref=$base_ref" >> "$GITHUB_OUTPUT"

      - name: Run workspace matrix
        working-directory: scripts/go
        run: go run ./rtk-cloud -- test-matrix

      - name: Run deterministic workspace E2E
        working-directory: scripts/go
        run: go run ./rtk-cloud -- test-e2e

      - name: Run Home load-runner contract tests
        working-directory: loadtests/home-100k
        env:
          GOWORK: "off"
        run: go test ./...

      - name: Run affected service suites
        working-directory: scripts/go
        shell: bash
        env:
          BASE_REF: ${{ steps.diff.outputs.base_ref }}
        run: |
          set -euo pipefail
          args=(--install)
          if [ -n "$BASE_REF" ]; then
            args+=(--changed-since "$BASE_REF" --head-ref HEAD)
          fi
          go run ./rtk-cloud -- test-services "${args[@]}"

      - name: Publish coverage summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Workspace test coverage"
            echo
            echo "- Baseline: \`test-matrix\`"
            echo "- Deterministic E2E: \`test-e2e\`"
            echo "- Load-runner contracts: \`loadtests/home-100k\`"
            echo "- Services: selected from the workspace diff; all on shared test-governance changes"
          } >> "$GITHUB_STEP_SUMMARY"
