name: Workspace Test Baseline

on:
  pull_request:
    paths:
      - '.github/workflows/workspace-test-baseline.yml'
      - 'e2e_test/**'
      - 'go.work'
      - 'go.work.sum'
      - 'loadtests/home-100k/**'
      - 'repos/rtk_cloud_contracts_doc'
      - 'scripts/go/**'
      - 'scripts/ci/init-submodules.sh'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: Workspace baseline, E2E, and affected services
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      FEATURE_EVIDENCE_RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}-feature
    steps:
      - name: Check out workspace
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: true
          submodules: false

      - name: Configure job-local PostgreSQL endpoint
        run: |
          printf 'TEST_DATABASE_URL=postgres://postgres:postgres@127.0.0.1:%s/postgres?sslmode=disable\n' \
            '${{ job.services.postgres.ports[5432] }}' >> "$GITHUB_ENV"

      - name: Initialize workspace submodules
        shell: bash
        env:
          CI_RUNNER_GITHUB_WORK_KEY: ${{ secrets.CI_RUNNER_GITHUB_WORK_KEY }}
        run: |
          set -euo pipefail
          test -n "$CI_RUNNER_GITHUB_WORK_KEY"
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$CI_RUNNER_GITHUB_WORK_KEY" > ~/.ssh/id_ed25519_github_work
          chmod 0600 ~/.ssh/id_ed25519_github_work
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git config --global core.sshCommand "ssh -i ~/.ssh/id_ed25519_github_work -o IdentitiesOnly=yes"
          git config --global --add url."git@github.com:".insteadOf "git@github-work.com:"
          git config --global --add url."git@github.com:".insteadOf "git@github.com-work:"
          git submodule sync --recursive
          git submodule foreach --recursive 'git reset --hard'
          git submodule update --init --recursive --depth=1

      - uses: actions/setup-go@v6
        with:
          # The baseline must satisfy the highest Go version required by any
          # service module, not only the workspace tooling version in go.work.
          go-version: "1.26.3"
          cache: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Resolve comparison base
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_ref="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base_ref="${{ github.event.before }}"
          else
            base_ref=""
          fi
          echo "base_ref=$base_ref" >> "$GITHUB_OUTPUT"

      - name: Fetch comparison submodule commits
        if: steps.diff.outputs.base_ref != ''
        env:
          BASE_REF: ${{ steps.diff.outputs.base_ref }}
        run: ./scripts/fetch-spec-impact-base.sh "$BASE_REF"

      - name: Run workspace matrix
        working-directory: scripts/go
        run: go run ./rtk-cloud -- test-matrix

      - name: Run deterministic workspace E2E
        working-directory: scripts/go
        run: |
          go run ./rtk-cloud -- test-e2e \
            --run-id "$FEATURE_EVIDENCE_RUN_ID" \
            --output-dir "../../.artifacts/test-runs/$FEATURE_EVIDENCE_RUN_ID/e2e"

      - name: Run deterministic product UI evidence
        working-directory: scripts/go
        run: |
          go run ./rtk-cloud -- test-ui \
            --full --desktop --mobile --install \
            --run-id "$FEATURE_EVIDENCE_RUN_ID"

      - name: Expose Playwright Chromium to Go browser checks
        working-directory: repos/rtk_cloud_admin/web
        shell: bash
        run: |
          set -euo pipefail
          chrome_path=$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")
          test -x "$chrome_path"
          printf 'CHROME_PATH=%s\n' "$chrome_path" >> "$GITHUB_ENV"

      - name: Run Home load-runner contract tests
        working-directory: loadtests/home-100k
        env:
          GOWORK: "off"
        run: go test ./...

      - name: Run affected service suites
        working-directory: scripts/go
        shell: bash
        env:
          BASE_REF: ${{ steps.diff.outputs.base_ref }}
        run: |
          set -euo pipefail
          args=(--install)
          if [ -n "$BASE_REF" ]; then
            args+=(--changed-since "$BASE_REF" --head-ref HEAD)
          fi
          go run ./rtk-cloud -- test-services "${args[@]}"

      - name: Qualify canonical authorization requirements
        working-directory: scripts/go
        run: |
          go run ./rtk-cloud -- test-services \
            --repo rtk_account_manager,rtk_cloud_admin,rtk_video_cloud \
            --qualification-only \
            --install \
            --qualification-run-id "$FEATURE_EVIDENCE_RUN_ID" \
            --qualification-output-dir "../../.artifacts/test-runs/$FEATURE_EVIDENCE_RUN_ID/authorization"

      - name: Enforce Node coverage policy
        working-directory: scripts/go
        shell: bash
        env:
          BASE_REF: ${{ steps.diff.outputs.base_ref }}
        run: |
          set -euo pipefail
          args=(
            --run-id "gh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-node"
            --head-ref HEAD
            --install
            --module "cloud-admin-web,cloud-client-javascript"
          )
          if [ -n "$BASE_REF" ]; then
            args+=(--base-ref "$BASE_REF")
          fi
          go run ./rtk-cloud -- test-coverage "${args[@]}"

      - name: Upload coverage profiles and report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: workspace-node-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/test-runs/gh-${{ github.run_id }}-${{ github.run_attempt }}-node/coverage/**
          if-no-files-found: error
          include-hidden-files: true
          retention-days: ${{ github.event_name == 'pull_request' && 30 || 90 }}

      - name: Audit product feature coverage
        if: always()
        working-directory: scripts/go
        shell: bash
        env:
          BASE_REF: ${{ steps.diff.outputs.base_ref }}
        run: |
          set -euo pipefail
          qualification="${{ vars.FEATURE_QUALIFICATION_MODE || 'observe' }}"
          if [ "$qualification" != "observe" ] && [ "$qualification" != "required" ]; then
            echo "FEATURE_QUALIFICATION_MODE must be observe or required, got: $qualification" >&2
            exit 1
          fi
          export FEATURE_QUALIFICATION_MODE="$qualification"
          action=audit
          if [ "$qualification" = "required" ]; then
            action=check
          fi
          go run ./rtk-cloud -- test-spec-inventory check \
            --mode "$qualification" \
            --output-dir "../../.artifacts/test-runs/gh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-spec-inventory"
          if [ -n "$BASE_REF" ]; then
            go run ./rtk-cloud -- test-spec-impact \
              --base "$BASE_REF" \
              --head HEAD \
              --output-dir "../../.artifacts/test-runs/gh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-spec-impact"
          fi
          coverage_mode=pr
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            coverage_mode=main
          fi
          args=(
            "$action"
            --mode "$coverage_mode"
            --evidence ".artifacts/test-runs/$FEATURE_EVIDENCE_RUN_ID"
            --output-dir "../../.artifacts/test-runs/gh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-feature-coverage"
          )
          if [ -n "$BASE_REF" ]; then
            args+=(--base "$BASE_REF" --head HEAD)
          fi
          go run ./rtk-cloud -- test-feature-coverage "${args[@]}"

      - name: Upload feature coverage audit
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: workspace-feature-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/test-runs/${{ env.FEATURE_EVIDENCE_RUN_ID }}/**
            .artifacts/test-runs/gh-${{ github.run_id }}-${{ github.run_attempt }}-feature-coverage/**
            .artifacts/test-runs/gh-${{ github.run_id }}-${{ github.run_attempt }}-spec-inventory/**
            .artifacts/test-runs/gh-${{ github.run_id }}-${{ github.run_attempt }}-spec-impact/**
          if-no-files-found: error
          include-hidden-files: true
          retention-days: ${{ github.event_name == 'pull_request' && 30 || 90 }}

      - name: Publish coverage summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Workspace test coverage"
            echo
            echo "- Baseline: \`test-matrix\`"
            echo "- Deterministic E2E: \`test-e2e\`"
            echo "- Load-runner contracts: \`loadtests/home-100k\`"
            echo "- Services: selected from the workspace diff; all on shared test-governance changes"
            echo "- Code coverage: per-module overall ratchets, 80% changed-Go-statement gate, JavaScript line/branch/function gates, and Video Cloud critical-package gates"
            echo "- Feature coverage: requirement-level product evidence; currently observe-only and never increased by code coverage"
            report=".artifacts/test-runs/gh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-node/coverage/TEST_REPORT.md"
            if [ -f "$report" ]; then
              echo
              sed -n '1,12p' "$report"
            fi
            feature_report=".artifacts/test-runs/gh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-feature-coverage/FEATURE_COVERAGE.md"
            if [ -f "$feature_report" ]; then
              echo
              sed -n '1,10p' "$feature_report"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
