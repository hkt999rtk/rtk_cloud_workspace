    layer: integration
    owner: rtk_video_cloud
    source: repos/rtk_video_cloud/internal/factoryenrollapp/cloud_handoff_integration_test.go
    selector: "./internal/factoryenrollapp#TestFactoryCloudHandoffApplicationRetainsFenceAcrossLostCompletion,./internal/postgres#TestFactoryCloudHandoffFreezesDrainsAndReplaysDurableDecisions,./internal/postgres#TestFactoryCloudHandoffAbortTombstonesAndConcurrentAdmission,./internal/postgres#TestFactoryCloudHandoffRejectsInvalidAndUnavailableEvidence,./internal/factoryenroll#TestFactoryCloudHandoffBindingAndDecisionValidation,./internal/factoryenroll#TestFactoryCloudHandoffPrepareReconcilesOnlyProvenWork,./internal/factoryenroll#TestFactoryCloudHandoffProjectedRecoveryRejectsUncertainCompletion,./internal/factoryenroll#TestFactoryCloudHandoffEndpointAuthenticatesAndFailsClosed"
    method: Actual factory application, PostgreSQL and mTLS issuer with an AM HTTP fault fixture retain the hold after lost completion and recover after application recreation. Concurrent admission, terminal decision replay, abort-before-prepare tombstones, version floors, immutable counts and credential boundaries are checked. Unknown signing/projection remains pending; real AM dispatch, Billing settlement and other producer cutoffs are not implied.
    runner: test-services
    environments: [ci]
    evidence: [json, junit]
    verifies: [REQ-VC-FACTORY-HANDOFF-001, REQ-VC-FACTORY-JOURNAL-001, REQ-MULTICLOUD-HANDOFF-001]
