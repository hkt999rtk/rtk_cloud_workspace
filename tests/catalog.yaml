  - id: INT-VC-MULTICLOUD-CANCEL-001
    title: Trusted issuer cancellation fences unclaimed reservations without guessing signing outcomes
    layer: integration
    owner: rtk_video_cloud
    source: repos/rtk_video_cloud/internal/factoryenrollapp/issuer_cancel_integration_test.go
    selector: "./internal/factoryenrollapp#TestFactoryIssuerCancellationAcrossMTLSAndPostgres,./internal/postgres#TestFactoryCancellationSerializesWithSigningClaims,./internal/certissuer#TestFactoryCancellationFencesDelayedSigningAndReplays,./internal/certissuer#TestFactoryCancellationRejectsUntrustedMalformedAndUnknownOutcomes,./internal/factoryenroll#TestIssuerCancellationClientValidatesFullReceipt,./internal/factoryenroll#TestHTTPRemoteIssuerClientPresentsClientCertificate"
    method: Real mTLS issuer/client and isolated PostgreSQL verify cancellation competes with signing on one reservation key, replays exact evidence, fences delayed signing and rejects started or completed issuance. Concurrent repository tests, malformed or mismatched receipts, unavailable storage and redirect rejection preserve holds. This tests the issuer primitive, not AM completion, background recovery or cloud handoff cutoffs.
    runner: test-services
    environments: [ci]
    evidence: [json, junit]
    verifies: [REQ-VC-FACTORY-JOURNAL-001, REQ-MULTICLOUD-HANDOFF-001]
    status: active
  - id: INT-AM-FACTORY-SERVICES-001
    title: Real Account Manager and factory application reconcile a lost committed response
    layer: integration
    owner: rtk_account_manager
    source: repos/rtk_account_manager/internal/api/factory_application_contract_integration_test.go
    selector: "./internal/api#TestIntegrationFactoryApplicationAcrossRealServices"
    method: AM runs its real HTTP router, JWT verifier, authorization and PostgreSQL ledger against a separately compiled Video Cloud factory application, journal, projections and mTLS issuer. Dropping issued and not-issued completion responses after real commits, then recreating the application and replaying preserves one signature, exact cancellation evidence, counters and projections. A revoked-owner prepared intent is durably canceled with no new signature or duplicate audit. Requires TEST_FACTORY_APPLICATION_BINARY and TEST_FACTORY_APPLICATION_DSN; absence is a skip, not proof. Does not establish process/cluster restart, lifecycle decision dispatch, started-signature recovery, Product CA or producer/Billing cutoffs.
    runner: test-services
    environments: [ci]
    evidence: [json, junit]
    verifies: [REQ-VC-FACTORY-JOURNAL-001, REQ-MULTICLOUD-HANDOFF-001, REQ-MULTICLOUD-SHARING-001]
    status: active
  - id: INT-VC-MULTICLOUD-FLOW-001
    title: Factory application coordinates admission, signing and projections before completion
    layer: integration
    owner: rtk_video_cloud
    source: repos/rtk_video_cloud/internal/factoryenrollapp/coordination_integration_test.go
    selector: "./internal/factoryenrollapp#TestFactoryApplicationCoordinatesIssuerAndDurableProjections,./internal/factoryenrollapp#TestNewRejectsPartialFactoryCoordinationConfiguration,./internal/postgres#TestFactoryEnrollmentLockSerializesAcrossConnectionsAndReleasesOnCancel,./internal/factoryenroll#TestCoordinationFailsClosedBeforeAndAfterExternalSteps,./internal/factoryenroll#TestCoordinationVerifiesCertificateIdentityKeyAndReceipt,./internal/certissuer#TestFactoryReplayOnlyNeverCreatesClaimOrSigns"
    method: Real factory application, PostgreSQL journal/projections/session locks and mTLS issuer run against an AM HTTP fixture. Lost completion and twelve retries preserve one certificate and no projection rewrites; revoked callers cannot retrieve results. Missing coordination, malformed receipts and replay-only misses fail closed. This is not real AM integration, autonomous recovery or a producer/Billing cutoff test.
    runner: test-services
    environments: [ci]
    evidence: [json, junit]
    verifies: [REQ-VC-FACTORY-JOURNAL-001, REQ-MULTICLOUD-HANDOFF-001, REQ-VC-FACTORY-BOUNDARY-001]
