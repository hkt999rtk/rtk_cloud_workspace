schema_version: 2

ui_local: &ui_local
  layer: ui
  owner: rtk_cloud_admin
  runner: test-ui
  targets: [desktop]
  environments: [local]
  evidence: [screenshot]
  method: Playwright headless browser drives the UI through the real Go BFF and deterministic fixture upstreams.
  status: active

ui_smoke: &ui_smoke
  <<: *ui_local
  targets: [desktop, mobile]
  tags: [smoke]

ui_staging: &ui_staging
  layer: ui
  owner: rtk_cloud_admin
  runner: test-ui
  targets: [desktop, mobile]
  environments: [staging]
  tags: [smoke, staging]
  evidence: [screenshot]
  method: Playwright headless browser performs read-only UI checks against staging with dedicated test accounts and data.
  status: active

sdk_e2e: &sdk_e2e
  layer: e2e
  owner: rtk_cloud_client
  runner: test-e2e
  targets: [ios, android]
  environments: [staging]
  evidence: [cloud-evidence, junit]
  method: Native SDK driver runs the declarative scenario and correlates app observations with cloud evidence.
  status: active

cases:
  - id: UNIT-AM-AUTH-001
    title: OIDC failures do not expose provider tokens
    layer: unit
    owner: rtk_account_manager
    source: repos/rtk_account_manager/internal/auth/oidc_test.go
    selector: TestOIDCTokenErrorsDoNotContainProviderTokens
    method: Go unit test injects provider token failures and asserts all returned errors are redacted.
    runner: test-coverage
    environments: [local, ci]
    evidence: [json, junit]
    status: active
  - id: UNIT-VC-SHADOW-001
    title: Device shadow rejects stale versions
    layer: unit
    owner: rtk_video_cloud
    source: repos/rtk_video_cloud/internal/deviceshadow/service_test.go
    selector: TestServiceRejectsStaleVersion
    method: Go unit test applies a stale expected version and asserts deterministic version-conflict rejection.
    runner: test-coverage
    environments: [local, ci]
    evidence: [json, junit]
    status: active
