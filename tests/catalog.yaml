    selector: "./internal/factoryhandoff#TestFactoryHandoffClientValidatesConfigurationAndExactReceipts,./internal/factoryhandoff#TestFactoryHandoffClientRejectsIncompleteOrMismatchedProof,./internal/factoryhandoff#TestFactoryHandoffClientBindsTerminalDecisionsAndRejectsTransportUncertainty"
    method: Bounded HTTP fixtures exercise exact scope, cutoff, count and digest receipts, terminal decision replay, configuration, redirects, malformed or missing evidence and uncertain transport. A 200 without complete durable evidence cannot release the AM operation fence. Real factory compatibility is exercised by INT-AM-FACTORY-SERVICES-001.
    runner: test-coverage
    environments: [ci]
    evidence: [json, junit]
    verifies: [REQ-MULTICLOUD-HANDOFF-001]
