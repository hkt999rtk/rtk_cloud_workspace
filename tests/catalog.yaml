    layer: integration
    owner: rtk_video_cloud
    source: repos/rtk_video_cloud/internal/factoryenrollapp/recovery_integration_test.go
    selector: "./internal/factoryenrollapp#TestFactoryRecoveryApplicationResumesDurableQueue,./internal/factoryenroll#TestFactoryRecoveryRetriesEveryDurableBoundaryWithoutFalseCompletion,./internal/factoryenroll#TestFactoryRecoveryEndpointQueuesOnlyAuthenticatedScopedRequests,./internal/postgres#TestFactoryCancellationJournalRetainsPendingUntilAMCompletion"
    method: Actual factory application and background loop resume persisted cancellation requests after application recreation, using PostgreSQL journal/locks and mTLS issuer against an AM HTTP fixture. Boundary failures retain holds and immutable evidence; unauthorized requests, delayed public retries and premature drain are rejected. Real AM compatibility is covered by INT-AM-FACTORY-SERVICES-001; lifecycle decision dispatch and started-signature recovery are not implied.
