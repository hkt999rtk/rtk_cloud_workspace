schema_version: 4

ui_local: &ui_local
  layer: ui
  owner: rtk_cloud_admin
  runner: test-ui
  targets: [desktop]
  environments: [local]
  evidence: [screenshot]
  method: Playwright headless browser drives the UI through the real Go BFF and deterministic fixture upstreams.
  status: active

ui_smoke: &ui_smoke
  <<: *ui_local
  targets: [desktop, mobile]
  tags: [smoke]

ui_staging: &ui_staging
  layer: ui
  owner: rtk_cloud_admin
  runner: test-ui
  targets: [desktop, mobile]
  environments: [staging]
  tags: [smoke, staging]
  evidence: [screenshot]
  method: Playwright headless browser performs read-only UI checks against staging with dedicated test accounts and data.
  status: active

sdk_e2e: &sdk_e2e
  layer: e2e
  owner: rtk_cloud_client
  runner: test-e2e
  targets: [ios, android]
  environments: [staging]
  evidence: [cloud-evidence, junit]
  method: Native SDK driver runs the declarative scenario and correlates app observations with cloud evidence.
  status: active

cases:
  - id: INT-VC-BILLING-HTTP-001
    title: Durable Video Cloud outbox delivers exact facts to real Billing HTTP
    layer: integration
    owner: cloud_platform
    source: repos/rtk_video_cloud/internal/mqttusageapp/billing_forwarder_integration_test.go
    selector: TestBillingForwarderDeliversToRealBillingHTTP
    method: An opt-in local cross-process run starts the exact Billing candidate with an isolated PostgreSQL database. Video Cloud atomically creates two outbox facts, receives exact created and duplicate responses, marks both delivered, and verifies changed quantity under the same ID returns conflict. It does not prove source cutoff completeness, distributed outbox ownership, capacity, CI, settlement, or staging.
    runner: test-services
    environments: [local]
    evidence: [console, junit]
    verifies: [REQ-BILL-USAGE-DELIVERY-001, REQ-MULTICLOUD-HANDOFF-001]
    status: active
  - id: INT-VC-BILLING-OUTBOX-001
    title: Complete usage receipts atomically retain immutable Billing facts for retry
    layer: integration
    owner: rtk_video_cloud
    source: repos/rtk_video_cloud/internal/postgres/usage_outbox_integration_test.go
    selector: "./internal/usage#TestBillingFactsMapCompleteEventDeterministically,./internal/usage#TestBillingClientRequiresExactIdempotentReceipt,./internal/usage#TestBillingClientRefusesRedirectAndMalformedBoundaries,./internal/postgres#TestBillingUsageOutboxIsAtomicImmutableAndRetryable,./internal/postgres#TestUsageCollectorCommitsFactsProjectionReceiptsAndCursorTogether,./internal/postgres#TestUsageCollectorRollsBackWholePageOnConflictAndRejectsStoreReplacement,./internal/mqttusageapp#TestForwardBillingFactsRetriesExactRowsAndDrainsBoundedly,./internal/config#TestValidateMQTTUsageRequiresCompleteBillingUsageBoundary"
    method: Unit and isolated PostgreSQL tests derive one deterministic Billing fact per measurement, bind the full canonical event, create all payloads in the source-receipt transaction, backfill only complete receipts, reject mutation/deletion/regression, retain ambiguous failures, bound backlog work, require a dedicated secure Billing boundary, and accept only exact created/duplicate responses. It does not certify producer drainage, Logger high-water completeness, rating, settlement, or transfer.
    runner: test-services
    environments: [ci]
    evidence: [json, junit]
    verifies: [REQ-BILL-USAGE-DELIVERY-001, REQ-MULTICLOUD-HANDOFF-001]
    status: active
  - id: INT-LOGGER-VC-COLLECTOR-001
    title: Real Logger HTTP inbox feeds the atomic Video Cloud usage collector
    layer: integration
    owner: cloud_platform
    source: repos/rtk_video_cloud/internal/postgres/usage_collector_logger_integration_test.go
    selector: TestUsageCollectorConsumesRealLoggerBillingInbox
    method: An opt-in local cross-process run starts the exact Logger candidate with a new private bbolt inbox, posts one canonical event and its replay through the billing HTTP boundary, then uses the real Video Cloud inbox client and isolated PostgreSQL collector to verify accepted/duplicate receipts and one atomic fact, MQTT projection, Logger receipt, and cursor. It does not prove Logger HA/PVC restore, producer drainage, Billing rating or settlement, CI, or staging.
    runner: test-services
    environments: [local]
    evidence: [console, junit]
    verifies: [REQ-MULTICLOUD-HANDOFF-001, REQ-LOGGER-BILLING-001]
    status: active
  - id: INT-VC-USAGE-COLLECTOR-001
    title: Logger receipt cursor, usage facts and MQTT projection commit as one transaction
    layer: integration
    owner: rtk_video_cloud
    source: repos/rtk_video_cloud/internal/postgres/usage_collector_integration_test.go
    selector: "./internal/postgres#TestUsageCollectorCommitsFactsProjectionReceiptsAndCursorTogether,./internal/postgres#TestUsageCollectorRollsBackWholePageOnConflictAndRejectsStoreReplacement,./internal/usage#TestLoggerInboxSourceVerifiesStoreSequenceContentAndNoStore,./internal/usage#TestLoggerInboxSourceFailsClosedOnMalformedOrUntrustedResponses,./internal/mqttusageapp#TestCollectUsagePagesDrainsStableCursorPages,./internal/mqttusageapp#TestCollectUsagePagesFailsClosedAndBoundsBacklog"
    method: Isolated PostgreSQL and strict HTTP fixtures verify store-bound continuous receipt pages, content binding, no-store responses, late horizons, concurrent old-cursor rejection, atomic immutable facts/MQTT projection/receipt/cursor writes, whole-page rollback, monotonic database guards, startup collection and bounded backlog. This does not prove producer drainage, legacy Loki reconciliation, Logger volume/HA, Billing rating or ownership-transfer settlement.
    runner: test-services
    environments: [ci]
    evidence: [json, junit]
    verifies: [REQ-MULTICLOUD-HANDOFF-001, REQ-LOGGER-BILLING-001]
    status: active
  - id: INT-LOGGER-BILLING-INBOX-001
    title: Durable billing receipts preserve content and complete commit-sequence pagination
    layer: integration
    owner: rtk_cloud_logger
    source: repos/rtk_cloud_logger/billing_inbox_test.go
    selector: "./#TestBillingInboxConcurrentReplayAndConflicts,./#TestBillingInboxPagesStableHorizonAndLateEvents,./#TestBillingInboxRecoversAfterProcessExit,./#TestBillingInboxRejectsUnsafeStorageAndInvalidInput,./#TestBillingInboxHTTPBoundaryAndPagination,./#TestBillingInboxBoundsAndCorruptReceipt,./#TestBillingInboxRejectsSymlinksClosedAndMalformedFiles,./#TestBillingCredentialCannotBypassWithEmptyOrMixedStream"
    method: Local bbolt and a crash subprocess verify atomic receipt identity, financial content conflicts, integer precision, 1002 equal-timestamp records, fixed page horizons and late arrivals, retained identity across restart, missing/foreign/corrupt storage rejection, response byte bounds and billing/operational credential isolation. No consumer cursor transaction, historical Loki reconciliation, HA routing, volume deployment, archival or producer-drain completeness is asserted.
    runner: test-services
    environments: [ci]
    evidence: [json, junit]
    verifies: [REQ-MULTICLOUD-HANDOFF-001, REQ-LOGGER-BILLING-001]
    status: active
  - id: INT-VC-EMQX-CALLBACK-001
    title: Actual EMQX preserves callback identity on HTTP retry and separates subscriber fanout
    layer: integration
    owner: rtk_video_cloud
    source: repos/rtk_video_cloud/internal/mqtt/billing_callback_integration_test.go
    selector: TestEMQXBillingCallbackRetryIntegration
    method: Opt-in local-owned Docker broker runs the workspace billing configuration script. After committing a publish callback the handler returns 503; actual EMQX retries with the same UUID while two subscribers have distinct delivery UUIDs. Binary byte counts and replay after meter restart remain exact. Requires Docker Desktop and an explicit local image/script; not broker restart, certificate trust, HA routing or durable Logger evidence.
    runner: test-services
    environments: [local]
    evidence: [json, junit]
    verifies: [REQ-MULTICLOUD-HANDOFF-001]
    status: active
  - id: INT-VC-CALLBACK-REPLAY-001
    title: Broker callback receipts and usage counts commit together across restart and replay
    layer: integration
    owner: rtk_video_cloud
    source: repos/rtk_video_cloud/internal/usage/callback_test.go
    selector: "./internal/usage#TestCallbackReceiptsSurviveRestartAndDoNotCollapseDeliveries,./internal/usage#TestCallbackTransactionRollbackAndLegacyImport,./internal/usage#TestCallbackRequiresStableIDAndValidBinaryPayload,./internal/usage#TestPersistentMeterRecoversFrozenAndUnflushedUsageAfterProcessExit,./internal/mqttusageapp#TestBrokerCallbackHTTPRejectsIdentityConflictsAndMissingIDs,./internal/mqttusageapp#TestConfiguredMeterRestoresAcknowledgedBrokerObservation"
    method: Local bbolt transactions and real application/PostgreSQL tests verify concurrent duplicate callbacks, changed-field conflicts, separate subscriber deliveries, binary byte counts, legacy import preservation, precommit rollback and lost committed replies. Process-exit recovery retains deduplication. This does not prove EMQX buffering/retry identity, durable Logger retention, distributed producer routing or scale capacity.
    runner: test-services
    environments: [ci]
    evidence: [json, junit]
    verifies: [REQ-MULTICLOUD-HANDOFF-001]
    status: active
  - id: INT-VC-METER-CHECKPOINT-001
    title: Persistent meter restores acknowledged observations and retains failed deliveries
    layer: integration
    owner: rtk_video_cloud
    source: repos/rtk_video_cloud/internal/usage/checkpoint_test.go
    selector: "./internal/usage#TestPersistentMeterRecoversFrozenAndUnflushedUsageAfterProcessExit,./internal/usage#TestPersistentMeterRetainsLostAckAndFailsClosedOnCheckpointDamage,./internal/usage#TestPersistentMeterRejectsUnsafePathsAndReversedClock,./internal/mqttusageapp#TestConfiguredMeterRestoresAcknowledgedBrokerObservation,./internal/mqttusageapp#TestMeterRecoveryHonorsCanceledContext,./internal/mqttusageapp#TestMeterRecoveryFlushDoesNotWaitForInterval,./internal/usage#TestLoggerSinkRequiresExactEventAcknowledgment"
    method: A child process exits without Close or Flush; a new process restores synced pending events and unflushed counters with original epoch and IDs. Tests reject competing ownership, corruption, unsafe paths and reversed clocks. Real application/PostgreSQL composition acknowledges a broker callback, restarts, and sends through a real Logger HTTP handler backed by its memory test store. Checkpoint failure returns 503, and bounded per-event receipts gate acknowledgment. This does not prove raw broker callback deduplication, durable Logger retention, PVC deployment or load capacity.
    runner: test-services
    environments: [ci]
    evidence: [json, junit]
    verifies: [REQ-MULTICLOUD-HANDOFF-001]
    status: active
  - id: INT-BILLING-PERIOD-BARRIER-001
    title: Invoice preparation serializes usage writes and retries under the cloud account lock
    layer: integration
    owner: rtk_billing
    source: repos/rtk_billing/internal/billingstore/period_barrier_integration_test.go
    selector: "./internal/billingstore#TestInvoiceCloseFencesConcurrentUsageAndRechecksIncompleteRetry,./internal/billingstore#TestInvoiceCloseWaitsForCommittedUsageAndSerializesCompetingCloses,./internal/billingstore#TestInvoiceCloseFailureRollsBackPeriodAndRejectsWrongAccount"
    method: Real isolated PostgreSQL connections pause invoice reads and verify actual blocking PIDs. Prior usage commits before pricing; late usage is rejected after closure; concurrent closes reuse one invoice; incomplete retries reacquire the fence. Injected line-write failure rolls back period and invoice, and mismatched cloud/account is denied. This does not certify upstream usage completeness or producer drainage.
    runner: test-services
    environments: [ci]
    evidence: [json, junit]
    verifies: [REQ-AM-INVOICE-LIFECYCLE-001, REQ-MULTICLOUD-HANDOFF-001]
    status: active
  - id: INT-BILLING-USAGE-INTEGRITY-001
    title: Billing usage replay binds every immutable fact field
    layer: integration
    owner: rtk_billing
    source: repos/rtk_billing/internal/billingstore/usage_integrity_integration_test.go
    selector: TestUsageReplayBindsEveryFieldRatherThanTrustingSourceHash
    method: Isolated PostgreSQL verifies full-field replay binding, UUID and timestamp normalization, concurrent conflicting writes and immutable SQL evidence. A supplied source hash cannot authorize altered scope or quantity. This does not prove upstream collection or settlement completeness.
    runner: test-coverage
    environments: [ci]
    evidence: [json, junit]
    verifies: [REQ-AM-INVOICE-LIFECYCLE-001, REQ-MULTICLOUD-HANDOFF-001]
    status: active
