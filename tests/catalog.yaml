    environments: [ci]
    evidence: [json, junit]
    verifies: [REQ-MULTICLOUD-HANDOFF-001]
    status: active
  - id: UNIT-VC-USAGE-RETRY-001
    title: Meter retries preserve the frozen usage window and fail closed without ingestion credentials
    layer: unit
    owner: rtk_video_cloud
    source: repos/rtk_video_cloud/internal/usage/integrity_test.go
    selector: "./internal/usage#TestUsageEvidenceRejectsChangedReplayAndOwnsItsSnapshot,./internal/usage#TestMeterRetriesFrozenSnapshotAfterPartialLostAcknowledgment,./internal/usage#TestMeterKeepsSubmicrosecondWindowOpen,./internal/mqttusageapp#TestUsageIngestWithoutConfiguredCredentialFailsClosed"
    method: Memory-ledger tests simulate a lost committed acknowledgment, preserve original event identity on retry, separate new observations, reject overflow and changed payloads, and keep submicrosecond windows open. HTTP tests reject all three ingestion routes with no token. In-memory retry is not restart durability or a real Logger acknowledgment proof.
    runner: test-services
    environments: [ci]
    evidence: [json, junit]
    verifies: [REQ-MULTICLOUD-HANDOFF-001]
    status: active
  - id: INT-AM-MULTICLOUD-CANCEL-001
    title: Cancellation intents fence delayed admissions without inventing quota or releasing handoff holds
    layer: integration
    owner: rtk_account_manager
    source: repos/rtk_account_manager/internal/store/factory_enrollment_cancellation_integration_test.go
    selector: "./internal/store#TestFactoryCancellationFencesAbsentAndDelayedAdmissions,./internal/store#TestFactoryCancellationRacesAdmissionAndPreservesIssuedOutcomes,./internal/store#TestFactoryCancellationValidationAndPersistenceFailures,./internal/store#TestFactoryEnrollmentPendingResultsBlockHandoffEvenWithAllReceipts,./internal/api#TestIntegrationFactoryCancellationRequiresTrustedCredentialAndFullBinding,./internal/usercache#TestStoreFactoryCoordinationRoutesBypassUserCache"
    method: Isolated PostgreSQL and real AM HTTP enforce dedicated cancellation authority, immutable admission provenance, late-admission fencing, quota preservation, audit rollback, terminal replay and handoff holds. A never-admitted cancellation key consumes no quota and cannot become issued. Issuer evidence and lifecycle dispatch remain separate checks.
    runner: test-services
    environments: [ci]
    evidence: [json, junit]
    verifies: [REQ-MULTICLOUD-HANDOFF-001]
    status: active
  - id: UNIT-AM-FACTORY-HANDOFF-001
