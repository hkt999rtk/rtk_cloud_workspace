    selector: "./internal/postgres#TestUsageReceiptSerializesFullEventAndRejectsChangedReplay,./internal/postgres#TestUsageEventCommitRequiresAllMetricsAndRollsBackPartialWrites,./internal/postgres#TestLegacyUsageReplayCannotCertifyOrExtendHistoricalMeasurements"
    method: Owned PostgreSQL verifies concurrent replay, immutable cloud and audit binding, all-metric transaction rollback, receipt completeness and legacy replay without inferred receipts. It does not certify Logger paging, durable cursors, Billing forwarding or producer drain.
