services:
  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${REPORT_OBJECT_STORAGE_ACCESS_KEY:?set REPORT_OBJECT_STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${REPORT_OBJECT_STORAGE_SECRET_KEY:?set REPORT_OBJECT_STORAGE_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  minio-data:
