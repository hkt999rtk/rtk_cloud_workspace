---
- name: Sync Home 100K load-test runner and per-VM manifests
  hosts: home_100k
  gather_facts: false
  become: true
  vars:
    remote_home_100k_dir: "{{ remote_workspace }}/loadtests/home-100k"
    remote_bin_dir: "{{ remote_home_100k_dir }}/bin"
    remote_manifest_dir: "{{ remote_home_100k_dir }}/shard-manifests"
    remote_telemetry_dir: "{{ remote_out_root }}/{{ run_id }}/sync-telemetry.d"
  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Install required sync/runtime packages
      ansible.builtin.apt:
        name:
          - rsync
          - ca-certificates
          - curl
        update_cache: true
        state: present

    - name: Install kubectl for staging service port-forwarding
      ansible.builtin.get_url:
        url: "https://dl.k8s.io/release/{{ kubectl_version | default('v1.35.3') }}/bin/linux/amd64/kubectl"
        dest: /usr/local/bin/kubectl
        mode: "0755"

    - name: Read remote disk before sync
      ansible.builtin.shell: df -B1 --output=used,avail,pcent,target / | awk 'NR==2 {printf "used_bytes=%s avail_bytes=%s used_pct=%s mount=%s", $1, $2, $3, $4}'
      register: disk_before
      changed_when: false

    - name: Create remote load-test directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ remote_bin_dir }}"
        - "{{ remote_manifest_dir }}"
        - "{{ remote_env_root }}"
        - "{{ remote_out_dir }}"
        - "{{ remote_telemetry_dir }}"

    - name: Inspect local runner binary
      ansible.builtin.stat:
        path: "{{ local_runner }}"
      delegate_to: localhost
      become: false
      register: local_runner_stat

    - name: Inspect local rtk-cloud binary
      ansible.builtin.stat:
        path: "{{ local_rtk_cloud }}"
      delegate_to: localhost
      become: false
      register: local_rtk_cloud_stat

    - name: Inspect local cloud-mqtt-test binary
      ansible.builtin.stat:
        path: "{{ local_cloud_mqtt_test }}"
      delegate_to: localhost
      become: false
      register: local_cloud_mqtt_test_stat

    - name: Inspect local shard manifest
      ansible.builtin.stat:
        path: "{{ local_shard_manifest }}"
      delegate_to: localhost
      become: false
      register: local_manifest_stat

    - name: Inspect local env archive
      ansible.builtin.stat:
        path: "{{ local_env_archive }}"
      delegate_to: localhost
      become: false
      register: local_env_archive_stat

    - name: Upload runner binary
      ansible.builtin.copy:
        src: "{{ local_runner }}"
        dest: "{{ remote_bin_dir }}/home-100k"
        mode: "0755"
      register: runner_copy

    - name: Upload rtk-cloud binary
      ansible.builtin.copy:
        src: "{{ local_rtk_cloud }}"
        dest: "{{ remote_bin_dir }}/rtk-cloud"
        mode: "0755"
      register: rtk_cloud_copy

    - name: Upload cloud-mqtt-test binary
      ansible.builtin.copy:
        src: "{{ local_cloud_mqtt_test }}"
        dest: "{{ remote_bin_dir }}/cloud-mqtt-test"
        mode: "0755"
      register: cloud_mqtt_test_copy

    - name: Upload this VM shard manifest
      ansible.builtin.copy:
        src: "{{ local_shard_manifest }}"
        dest: "{{ remote_shard_manifest }}"
        mode: "0644"
      register: manifest_copy

    - name: Upload compressed env-root shard archive
      ansible.builtin.copy:
        src: "{{ local_env_archive }}"
        dest: "{{ remote_out_dir }}/env-root.tar.gz"
        mode: "0600"
      register: env_archive_copy

    - name: Extract env-root shard archive
      ansible.builtin.unarchive:
        src: "{{ remote_out_dir }}/env-root.tar.gz"
        dest: "{{ remote_env_root }}"
        remote_src: true
      register: env_extract

    - name: Read remote disk after sync
      ansible.builtin.shell: df -B1 --output=used,avail,pcent,target / | awk 'NR==2 {printf "used_bytes=%s avail_bytes=%s used_pct=%s mount=%s", $1, $2, $3, $4}'
      register: disk_after
      changed_when: false

    - name: Write remote sync telemetry
      ansible.builtin.copy:
        dest: "{{ remote_telemetry_dir }}/{{ vm_label }}.json"
        mode: "0644"
        content: |
          {
            "label": "{{ vm_label }}",
            "files_transferred": {{ (1 if env_archive_copy.changed else 0) + (1 if runner_copy.changed else 0) + (1 if rtk_cloud_copy.changed else 0) + (1 if cloud_mqtt_test_copy.changed else 0) + (1 if manifest_copy.changed else 0) }},
            "bytes_transferred": {{ ((local_env_archive_stat.stat.size | default(0) | int) if env_archive_copy.changed else 0) + ((local_runner_stat.stat.size | default(0) | int) if runner_copy.changed else 0) + ((local_rtk_cloud_stat.stat.size | default(0) | int) if rtk_cloud_copy.changed else 0) + ((local_cloud_mqtt_test_stat.stat.size | default(0) | int) if cloud_mqtt_test_copy.changed else 0) + ((local_manifest_stat.stat.size | default(0) | int) if manifest_copy.changed else 0) }},
            "remote_disk_before": {{ disk_before.stdout | to_json }},
            "remote_disk_after": {{ disk_after.stdout | to_json }}
          }
